asset:
  id: ndl-environment-air-quality-chart
  title: "NDL Environment collection: Air quality chart data"
  iri: https://www.data.gov.uk/collections/environment/air-quality
  owner: Department for Environment, Food and Rural Affairs
  importance: 3
  source: external        # NDL republishes data it does not produce
  influence: false        # NDL cannot change the publisher\'s data structure
  target_policy: low
rules:
  - {id: R1, check: unique, columns: [Year]}
  - {id: R2, check: type, column: Year, kind: year}
  - {id: R3, check: range, column: "Mean number of days with moderate or above pollution", min: 0, max: 366}
  - {id: R4, check: freshness, column: Year, expected: P1Y, lag: P6M, description: "Annual air quality statistics are usually published in spring, so the previous year should be present by autumn"}
  - {id: R5, check: no_gaps, column: Year}
  - {id: R6, check: header_has_unit, columns: ["Mean number of days with moderate or above pollution"]}
