asset:
  id: ndl-transport-road-traffic-chart
  title: "NDL Transport collection: Road traffic chart data"
  iri: https://www.data.gov.uk/collections/transport/road-traffic
  owner: Department for Transport
  importance: 3
  source: external        # NDL republishes data it does not produce
  influence: false        # NDL cannot change the publisher\'s data structure
  target_policy: low
rules:
  - {id: R1, check: unique, columns: [Year]}
  - {id: R2, check: type, column: Year, kind: year}
  - {id: R3, check: range, column: "Billion vehicle miles (all motor vehicles)", min: 100, max: 500}
  - {id: R4, check: freshness, column: Year, expected: P1Y, lag: P9M}
  - {id: R5, check: no_gaps, column: Year}
  - {id: R6, check: header_has_unit, columns: ["Billion vehicle miles (all motor vehicles)"]}
