<style id="dqp-shell-css">
/* Public Sector Data Quality Commons shell: one top bar, grouped menus and the guided tour, shared by every page. */
:root{
  --dqp-bar:#0b4f52; --dqp-bar-fg:#f2f7f7; --dqp-bar-muted:#b9d6d5; --dqp-bar-active:#ffffff;
  --dqp-bar-line:#2a6e70; --dqp-focus:#ffbf47; --dqp-panel:#ffffff; --dqp-panel-fg:#17212b; --dqp-panel-muted:#56636e; --dqp-panel-line:#d6dddf; --dqp-icon:#0d6b6e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --dqp-bar:#0e2a2f; --dqp-bar-fg:#e5eff0; --dqp-bar-muted:#8fb3b4; --dqp-bar-active:#ffffff; --dqp-bar-line:#24474b;
  --dqp-panel:#172129; --dqp-panel-fg:#e5ecef; --dqp-panel-muted:#9aa9b3; --dqp-panel-line:#2b3a44; --dqp-icon:#7cc9c4}}
:root[data-theme="dark"]{--dqp-bar:#0e2a2f; --dqp-bar-fg:#e5eff0; --dqp-bar-muted:#8fb3b4; --dqp-bar-active:#ffffff; --dqp-bar-line:#24474b;
  --dqp-panel:#172129; --dqp-panel-fg:#e5ecef; --dqp-panel-muted:#9aa9b3; --dqp-panel-line:#2b3a44; --dqp-icon:#7cc9c4}
[hidden]{display:none!important}
.dqi{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dqi-lg{width:28px;height:28px;padding:7px;border-radius:9px;background:var(--accent-soft, #e3f0ef);color:var(--accent, #0d6b6e);box-sizing:content-box}
.dqp-g>summary .dqi{margin-right:5px;opacity:.9}
.dqp-panel a,.dqp-grp a{display:grid!important;grid-template-columns:22px minmax(0,1fr);column-gap:10px;align-items:start}
.dqp-panel a .dqi,.dqp-grp a .dqi{margin-top:2px;color:var(--dqp-icon)}
.dqp-panel a small,.dqp-grp a small{grid-column:2}
.eyebrow .dqi{margin-right:6px}
.dqp-skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--dqp-focus);color:#0b0c0c;padding:8px 12px;font:600 14px/1.3 "Public Sans",system-ui,sans-serif}
.dqp-skip:focus{left:max(16px, env(safe-area-inset-left, 0px));top:calc(8px + env(safe-area-inset-top, 0px))}
.dqp-bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--dqp-bar);color:var(--dqp-bar-fg);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;border-bottom:1px solid var(--dqp-bar-line)}
.dqp-in{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;display:flex;align-items:center;gap:14px;min-height:54px;position:relative}
.dqp-brand{display:flex;align-items:center;gap:10px;color:var(--dqp-bar-fg);text-decoration:none;font-weight:700;font-size:15px;min-width:0}
.dqp-brand svg{flex:none}
.dqp-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dqp-brand small{display:block;font-weight:500;font-size:11px;color:var(--dqp-bar-muted);letter-spacing:.02em}
.dqp-nav{display:flex;gap:2px;margin-left:auto;align-items:stretch}
.dqp-g{position:relative}
.dqp-g>summary,.dqp-menu>summary{list-style:none;cursor:pointer;color:var(--dqp-bar-muted);font-size:14px;font-weight:600;padding:17px 11px 14px;border-bottom:3px solid transparent;white-space:nowrap}
.dqp-g>summary::-webkit-details-marker,.dqp-menu>summary::-webkit-details-marker{display:none}
.dqp-g>summary::after{content:"";display:inline-block;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 0 3px 7px}
.dqp-g[open]>summary::after{transform:rotate(-135deg);margin-bottom:-1px}
.dqp-g>summary:hover,.dqp-g[open]>summary{color:var(--dqp-bar-active)}
.dqp-g[data-current]>summary{color:var(--dqp-bar-active);border-bottom-color:var(--dqp-focus)}
.dqp-panel{position:absolute;right:0;top:100%;min-width:320px;max-width:min(400px,calc(100vw - 32px));background:var(--dqp-panel);color:var(--dqp-panel-fg);
  border:1px solid var(--dqp-panel-line);border-radius:0 0 8px 8px;box-shadow:0 12px 28px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.dqp-panel a,.dqp-grp a{display:block;color:var(--dqp-panel-fg);text-decoration:none;padding:10px 12px;border-radius:6px;font-size:14.5px;font-weight:600}
.dqp-panel a:hover{background:rgba(13,107,110,.08)}
.dqp-panel a small,.dqp-grp a small{display:block;font-weight:400;font-size:12.5px;color:var(--dqp-panel-muted);margin-top:2px}
.dqp-panel a[aria-current="page"]{box-shadow:inset 4px 0 0 var(--dqp-focus);background:rgba(13,107,110,.06)}
.dqp-tourbtn{font:600 13px/1 "Public Sans",system-ui,sans-serif;color:var(--dqp-bar-fg);background:transparent;border:1px solid var(--dqp-bar-line);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap;margin-left:6px}
.dqp-tourbtn:hover{border-color:var(--dqp-bar-fg)}
.dqp-bar a:focus-visible,.dqp-bar summary:focus-visible,.dqp-bar button:focus-visible,.dqp-panel a:focus-visible{outline:3px solid var(--dqp-focus);outline-offset:-3px}
.dqp-menu{display:none;margin-left:auto}
.dqp-menu>summary{color:var(--dqp-bar-fg);padding:9px 12px;border:1px solid var(--dqp-bar-line);border-radius:6px}
.dqp-drop{display:none}
.dqp-menu[open] .dqp-drop{display:block;position:absolute;left:0;right:0;top:100%;background:var(--dqp-panel);border-bottom:1px solid var(--dqp-panel-line);
  max-height:calc(100vh - 60px);overflow-y:auto;padding:6px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));box-shadow:0 12px 28px rgba(0,0,0,.2)}
.dqp-grp h2{font:700 11.5px/1 "Public Sans",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--dqp-panel-muted);margin:14px 12px 4px}
.dqp-grp a[aria-current="page"]{box-shadow:inset 4px 0 0 var(--dqp-focus)}
@media (max-width:1000px){.dqp-nav{display:none}.dqp-menu{display:block}.dqp-tourbtn{margin-left:0}}
.dqp-short{display:none}
@media (max-width:520px){.dqp-brand small{display:none}.dqp-long{display:none}.dqp-short{display:inline}}
.dqc-ctx{background:var(--dqp-panel);color:var(--dqp-panel-fg);border:1px solid var(--dqp-panel-line);border-left:4px solid var(--dqp-focus);border-radius:6px;padding:10px 14px;font:400 14px/1.55 "Public Sans",system-ui,sans-serif;max-width:80ch;margin-top:10px}
.dqc-ctx a{color:inherit;text-decoration:underline;font-weight:600}
.dqp-foot{font-family:"Public Sans",system-ui,sans-serif;font-size:13px;line-height:1.5;color:var(--muted, #56636e);border-top:3px solid var(--accent, #0d6b6e);background:var(--surface, #fff);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:22px calc(28px + env(safe-area-inset-bottom, 0px))}
.dqp-fcols{max-width:1180px;margin:0 auto;display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.dqp-foot h2{font:700 12px/1.2 "Public Sans",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--fg, #17212b);margin:0 0 8px}
.dqp-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dqp-foot li .dqi{margin-right:6px;color:var(--accent, #0d6b6e)}
.dqp-colo{max-width:1180px;margin:16px auto 0;padding-top:12px;border-top:1px solid var(--line, #d6dddf)}
.dqp-foot a{color:var(--accent, #0d6b6e)}
/* Guided tour: a non-modal dialog beside the highlighted element. */
.dqp-tour{position:fixed;z-index:90;width:min(360px,calc(100vw - 32px));background:var(--dqp-panel);color:var(--dqp-panel-fg);border:2px solid var(--dqp-focus);
  border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:16px 18px;font:15px/1.5 "Public Sans",system-ui,sans-serif;display:flex;flex-direction:column;gap:10px}
.dqp-tour h2{font:700 16px/1.3 "Public Sans",system-ui,sans-serif;margin:0}
.dqp-tour p{margin:0}
.dqp-tour .dqp-step{font-size:12.5px;color:var(--dqp-panel-muted)}
.dqp-tour .dqp-tbtns{display:flex;gap:8px;flex-wrap:wrap}
.dqp-tour button{font:600 14px/1 "Public Sans",system-ui,sans-serif;padding:9px 14px;border-radius:6px;cursor:pointer;border:1px solid #0d6b6e;background:#0d6b6e;color:#fff}
.dqp-tour button.dqp-ghost{background:transparent;color:var(--dqp-panel-fg);border-color:var(--dqp-panel-line)}
.dqp-tour button:focus-visible{outline:3px solid var(--dqp-focus);outline-offset:2px}
.dqp-hl{outline:4px solid var(--dqp-focus)!important;outline-offset:4px;border-radius:6px;scroll-margin:90px}
</style>
<a class="dqp-skip" href="#dqp-main">Skip to main content</a>
{{ICONS}}
<div class="dqp-bar" role="banner">
  <div class="dqp-in">
    <a class="dqp-brand" href="index.html" aria-label="{{BRAND}}, home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 15l4 4 9-10" fill="none" stroke="#ffbf47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>{{BRAND}}<small>{{BUILD}}</small></span>
    </a>
    <nav class="dqp-nav" aria-label="Commons">{{NAV}}</nav>
    <details class="dqp-menu"><summary aria-label="Open the menu">Menu</summary><nav class="dqp-drop" aria-label="Commons (menu)">{{NAV_LONG}}</nav></details>
    <button class="dqp-tourbtn" type="button" id="dqp-tour-start" hidden><span class="dqp-long">Take the tour</span><span class="dqp-short">Tour</span></button>
  </div>
</div>
<span id="dqp-main" tabindex="-1"></span>
<script>
(function () {
  "use strict";
  // Icon helper for pages: DQI("name") gives a decorative inline icon from the shared sprite.
  window.DQI = function (n, cls) { return '<svg class="dqi' + (cls ? " " + cls : "") + '" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>'; };
  // Menus: one group open at a time; Escape and clicks outside close them.
  var groups = Array.prototype.slice.call(document.querySelectorAll(".dqp-g, .dqp-menu"));
  groups.forEach(function (d) {
    d.addEventListener("toggle", function () { if (d.open) groups.forEach(function (o) { if (o !== d) o.open = false; }); });
  });
  document.addEventListener("click", function (e) { groups.forEach(function (d) { if (d.open && !d.contains(e.target)) d.open = false; }); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    groups.forEach(function (d) { if (d.open) { d.open = false; d.querySelector("summary").focus(); } });
  });

  // Guided tour. A page sets window.DQP_TOUR = [{sel, title, text}] before or after this script runs.
  var box = null, i = 0, steps = [], lastEl = null, opener = null;
  function end() {
    if (lastEl) lastEl.classList.remove("dqp-hl");
    if (box) box.remove();
    box = null; lastEl = null;
    document.removeEventListener("keydown", key, true);
    if (opener) opener.focus();
  }
  function key(e) {
    if (!box) return;
    if (e.key === "Escape") { e.preventDefault(); end(); }
    else if (e.key === "ArrowRight" && box.contains(document.activeElement)) { e.preventDefault(); go(i + 1); }
    else if (e.key === "ArrowLeft" && box.contains(document.activeElement)) { e.preventDefault(); go(i - 1); }
  }
  function place(el) {
    var vw = window.innerWidth, vh = window.innerHeight, w = box.offsetWidth, h = box.offsetHeight;
    var r = el ? el.getBoundingClientRect() : null, top, left;
    if (!r || vw < 640) { top = vh - h - 16; left = (vw - w) / 2; }
    else {
      top = r.bottom + 12 + h < vh ? r.bottom + 12 : Math.max(70, r.top - h - 12);
      left = Math.min(Math.max(16, r.left), vw - w - 16);
    }
    box.style.top = Math.max(16, top) + "px"; box.style.left = left + "px";
  }
  function go(n) {
    if (n < 0 || n >= steps.length) { end(); return; }
    i = n;
    var s = steps[i], el = s.sel ? document.querySelector(s.sel) : null;
    if (lastEl) lastEl.classList.remove("dqp-hl");
    lastEl = el;
    if (el) {
      el.classList.add("dqp-hl");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    }
    box.innerHTML = "";
    var step = document.createElement("p"); step.className = "dqp-step"; step.textContent = "Step " + (i + 1) + " of " + steps.length;
    var h = document.createElement("h2"); h.id = "dqp-tour-h"; h.textContent = s.title;
    var p = document.createElement("p"); p.id = "dqp-tour-d"; p.textContent = s.text;
    var btns = document.createElement("div"); btns.className = "dqp-tbtns";
    function b(label, ghost, fn) { var x = document.createElement("button"); x.type = "button"; x.textContent = label; if (ghost) x.className = "dqp-ghost"; x.onclick = fn; btns.appendChild(x); return x; }
    if (i > 0) b("Back", true, function () { go(i - 1); });
    var next = b(i === steps.length - 1 ? "Finish" : "Next", false, function () { go(i + 1); });
    b("Close tour", true, end);
    box.append(step, h, p, btns);
    setTimeout(function () { place(el); next.focus(); }, el ? 350 : 0);
  }
  function start() {
    steps = (window.DQP_TOUR || []).filter(function (s) { return !s.sel || document.querySelector(s.sel); });
    if (!steps.length) return;
    opener = document.activeElement;
    box = document.createElement("div");
    box.className = "dqp-tour"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "false");
    box.setAttribute("aria-labelledby", "dqp-tour-h"); box.setAttribute("aria-describedby", "dqp-tour-d");
    document.body.appendChild(box);
    document.addEventListener("keydown", key, true);
    window.addEventListener("resize", function () { if (box) place(lastEl); });
    go(0);
  }
  var btn = document.getElementById("dqp-tour-start");
  btn.addEventListener("click", start);
  function ready() { if ((window.DQP_TOUR || []).length) btn.hidden = false; }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready); else setTimeout(ready, 0);
  window.DQP_startTour = start;
  if (/[?&]tour=1\b/.test(location.search)) document.addEventListener("DOMContentLoaded", function () { setTimeout(start, 400); });
})();
</script>
