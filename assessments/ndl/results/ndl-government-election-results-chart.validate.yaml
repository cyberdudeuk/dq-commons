# R validate rules for ndl-government-election-results-chart (generated by dqkit)
# Use: library(validate); v <- validator(.file = 'this.yaml'); confront(dat, v)
# not exported: R5 (header_has_unit): run with dqkit; no direct validate equivalent
rules:
- expr: all(c("Party name", "Vote share", "Election") %in% names(.))
  name: R1
  label: The file says which election the shares are for
  description: 'dimension: completeness'
- expr: is_unique(`Party name`)
  name: R2
  label: unique
  description: 'dimension: uniqueness'
- expr: in_range(`Vote share`, min = 0, max = 100)
  name: R3
  label: range
  description: 'dimension: accuracy'
- expr: sum(`Vote share`, na.rm = TRUE) <= 100.01
  name: R4
  label: Shares do not add up to more than 100%
  description: 'dimension: consistency'
