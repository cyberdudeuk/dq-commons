# R validate rules for ndl-early-years-childhood-vaccinations-chart (generated by dqkit)
# Use: library(validate); v <- validator(.file = 'this.yaml'); confront(dat, v)
# not exported: R7 (freshness): run with dqkit; no direct validate equivalent
# not exported: R8 (no_gaps): run with dqkit; no direct validate equivalent
# not exported: R9 (header_has_unit): run with dqkit; no direct validate equivalent
rules:
- expr: is_unique(`year`)
  name: R1
  label: One row per year
  description: 'dimension: uniqueness'
- expr: is.numeric(`year`)
  name: R2
  label: type
  description: 'dimension: validity'
- expr: in_range(`england`, min = 0, max = 100)
  name: R3
  label: England coverage is a valid percentage
  description: 'dimension: accuracy'
- expr: in_range(`scotland`, min = 0, max = 100)
  name: R4
  label: range
  description: 'dimension: accuracy'
- expr: in_range(`wales`, min = 0, max = 100)
  name: R5
  label: range
  description: 'dimension: accuracy'
- expr: in_range(`northern-ireland`, min = 0, max = 100)
  name: R6
  label: range
  description: 'dimension: accuracy'
