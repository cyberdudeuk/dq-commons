# R validate rules for ndl-people-social-mobility-chart (generated by dqkit)
# Use: library(validate); v <- validator(.file = 'this.yaml'); confront(dat, v)
rules:
- expr: is_unique(`Socio-economic background`)
  name: R1
  label: unique
  description: 'dimension: uniqueness'
- expr: '`Socio-economic background` %in% c("Higher professional", "Lower professional",
    "Intermediate", "Higher working", "Lower working")'
  name: R2
  label: in_set
  description: 'dimension: validity'
- expr: in_range(`Percentage (%)`, min = 0, max = 100)
  name: R3
  label: range
  description: 'dimension: accuracy'
- expr: all(c("Socio-economic background", "Percentage (%)", "Measure", "Year") %in%
    names(.))
  name: R4
  label: The file says what the percentage measures and for which year
  description: 'dimension: completeness'
