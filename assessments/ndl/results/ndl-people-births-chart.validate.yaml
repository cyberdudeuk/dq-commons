# R validate rules for ndl-people-births-chart (generated by dqkit)
# Use: library(validate); v <- validator(.file = 'this.yaml'); confront(dat, v)
# not exported: R6 (freshness): run with dqkit; no direct validate equivalent
# not exported: R7 (no_gaps): run with dqkit; no direct validate equivalent
# not exported: R8 (header_has_unit): run with dqkit; no direct validate equivalent
rules:
- expr: all(c("Year", "Number of Live Births") %in% names(.))
  name: R1
  label: Expected columns are present
  description: 'dimension: completeness'
- expr: '!is.na(`Year`)'
  name: R2
  label: Every row has a year
  description: 'dimension: completeness'
- expr: is_unique(`Year`)
  name: R3
  label: One row per year
  description: 'dimension: uniqueness'
- expr: is.numeric(`Year`)
  name: R4
  label: Year is a four-digit year
  description: 'dimension: validity'
- expr: in_range(`Number of Live Births`, min = 400000, max = 1000000)
  name: R5
  label: Births are within a plausible range for England and Wales
  description: 'dimension: accuracy'
