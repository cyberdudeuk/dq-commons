# R validate rules for ndl-transport-mot-results-chart (generated by dqkit)
# Use: library(validate); v <- validator(.file = 'this.yaml'); confront(dat, v)
# not exported: R5 (header_has_unit): run with dqkit; no direct validate equivalent
rules:
- expr: is_unique(`Financial year`)
  name: R1
  label: unique
  description: 'dimension: uniqueness'
- expr: grepl("^(\\d{4}[-/]\\d{2,4})$", `Financial year`)
  name: R2
  label: Financial years are written as 2024-25, not 2024
  description: 'dimension: validity'
- expr: '`fails_millions` <= `tests_millions`'
  name: R3
  label: Fails never exceed tests
  description: 'dimension: consistency'
- expr: in_range(`tests_millions`, min = 0, max = 100)
  name: R4
  label: range
  description: 'dimension: accuracy'
