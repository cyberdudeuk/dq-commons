# R validate rules for ndl-transport-road-traffic-chart (generated by dqkit)
# Use: library(validate); v <- validator(.file = 'this.yaml'); confront(dat, v)
# not exported: R4 (freshness): run with dqkit; no direct validate equivalent
# not exported: R5 (no_gaps): run with dqkit; no direct validate equivalent
# not exported: R6 (header_has_unit): run with dqkit; no direct validate equivalent
rules:
- expr: is_unique(`Year`)
  name: R1
  label: unique
  description: 'dimension: uniqueness'
- expr: is.numeric(`Year`)
  name: R2
  label: type
  description: 'dimension: validity'
- expr: in_range(`Billion vehicle miles (all motor vehicles)`, min = 100, max = 500)
  name: R3
  label: range
  description: 'dimension: accuracy'
