[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqkit"
version = "0.4.0"
description = "Data quality assurance kit for critical data assets and the National Data Library (GOV.UK DQAP and issues framework)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "jsonschema>=4.0", "openpyxl>=3.1", "python-docx>=1.1"]

[project.scripts]
dqkit = "dqkit.cli:main"

[tool.setuptools]
packages = ["dqkit"]

[tool.setuptools.package-data]
dqkit = ["*.json"]
