[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dqkit"
version = "1.6.0"
description = "Public Sector Data Quality Commons toolkit: measure, report and improve data quality with open standards"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.3.3,<3.1", "pyyaml>=6.0.3", "jsonschema>=4.26.0", "openpyxl>=3.1.5", "python-docx>=1.2.0", "odfpy>=1.4.1", "requests>=2.34.2"]

[project.scripts]
dqkit = "dqkit.cli:main"

[tool.setuptools]
packages = ["dqkit"]

[tool.setuptools.package-data]
dqkit = ["*.json"]
