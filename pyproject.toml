[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqkit"
version = "2.8.0"
description = "Public Sector Data Quality Commons toolkit: measure, report and improve data quality with open standards"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<4", "pyyaml>=6.0", "jsonschema>=4.0", "openpyxl>=3.1", "python-docx>=1.1", "odfpy>=1.4", "requests>=2.31"]

[project.scripts]
dqkit = "dqkit.cli:main"

[tool.setuptools]
packages = ["dqkit"]

[tool.setuptools.package-data]
dqkit = ["*.json"]
