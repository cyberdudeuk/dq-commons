# Data quality frameworks, standards, policies and methods relevant to the UK public sector.
#
# One entry per source. "dimensions" uses each source's own words; "map" translates each of them to
# the kit's dimensions (vocab/dimensions.csv), which drives the crosswalk and conversion
# (`dqkit crosswalk`). A source dimension mapped to several kit dimensions lists them all; one with
# no kit equivalent maps to [] and is reported as "not measured by data rules".
#
# verified: "yes" means the facts here were checked against the source or its publisher's page in
# October 2026. "partly" means the existence, owner and link were checked, but some detail comes from
# general knowledge and should be confirmed against the full text (several ISO texts are paid-for).
# Summaries are in our own words. Nothing here reproduces a standard's text.
review:
  last_reviewed: '2026-10-15'
  owner_role: Content steward (standards)
frameworks:
- id: uk-gdqf
  name: The Government Data Quality Framework
  publisher: Government Data Quality Hub (ONS)
  jurisdiction: UK
  sector: Cross-government
  type: framework
  year: '2020'
  status: In use (guidance)
  applies_to: All government data
  url: https://www.gov.uk/government/publications/the-government-data-quality-framework/the-government-data-quality-framework
  verified: 'yes'
  principles:
  - Commit to data quality
  - Know your users and their needs
  - Assess quality throughout the data lifecycle
  - Communicate data quality clearly and effectively
  - Anticipate changes affecting data quality
  lifecycle:
  - Plan
  - Collect or acquire, and ingest
  - Prepare, store and maintain
  - Use and process
  - Share and publish
  - Archive or destroy
  dimensions:
  - Completeness
  - Uniqueness
  - Consistency
  - Timeliness
  - Validity
  - Accuracy
