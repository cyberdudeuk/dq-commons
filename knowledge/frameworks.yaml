# Data quality frameworks, standards, policies and methods relevant to the UK public sector.
#
# One entry per source. "dimensions" uses each source's own words; "map" translates each of them to
# the kit's dimensions (vocab/dimensions.csv), which drives the crosswalk and conversion
# (`dqkit crosswalk`). A source dimension mapped to several kit dimensions lists them all; one with
# no kit equivalent maps to [] and is reported as "not measured by data rules".
#
# verified: "yes" means the facts here were checked against the source or its publisher's page in
# October 2026. "partly" means the existence, owner and link were checked, but some detail comes from
# general knowledge and should be confirmed against the full text (several ISO texts are paid-for).
# Summaries are in our own words. Nothing here reproduces a standard's text.

frameworks:

# ---------------- UK cross-government ----------------
- id: uk-gdqf
  name: The Government Data Quality Framework
  publisher: Government Data Quality Hub (ONS)
  jurisdiction: UK
  sector: Cross-government
  type: framework
  year: "2020"
  status: In use (guidance)
  applies_to: All government data
  url: https://www.gov.uk/government/publications/the-government-data-quality-framework/the-government-data-quality-framework
  verified: "yes"
  principles: [Commit to data quality, Know your users and their needs, Assess quality throughout the data lifecycle,
               Communicate data quality clearly and effectively, Anticipate changes affecting data quality]
  lifecycle: [Plan, "Collect or acquire, and ingest", "Prepare, store and maintain", Use and process, Share and publish, Archive or destroy]
  dimensions: [Completeness, Uniqueness, Consistency, Timeliness, Validity, Accuracy]
  map: {Completeness: [completeness], Uniqueness: [uniqueness], Consistency: [consistency], Timeliness: [timeliness],
        Validity: [validity], Accuracy: [accuracy]}
  scoring: None prescribed; recommends action plans and root cause analysis
  pack: uk-gdqf

- id: uk-dam-policy
  name: Data asset management policy in government
  publisher: Government Digital Service (DSIT)
  jurisdiction: UK
  sector: Cross-government
  type: policy
  year: "2026"
  status: Mandatory for departments and arm's length bodies (shared critical data assets)
  applies_to: Critical data assets (CDAs)
  url: https://www.gov.uk/government/publications/data-asset-management-policy-in-government/data-asset-management-policy-in-government
  verified: "yes"
  dimensions: ["Data quality (via DQAP)", Discoverability, Interoperability, Ownership]
  map: {"Data quality (via DQAP)": [completeness, uniqueness, consistency, timeliness, validity, accuracy], Discoverability: [metadata],
        Interoperability: [coherence-comparability, validity], Ownership: [metadata]}
  scoring: Data quality issues framework (importance × impact, bands, priority)
  pack: uk-dam-cda
  notes: Not mandatory for the devolved governments, which can adopt it voluntarily.

- id: uk-dqap
  name: Implement a data quality action plan, and the data quality issues framework
  publisher: Government Digital Service (DSIT)
  jurisdiction: UK
  sector: Cross-government
  type: guidance
  year: "2026"
  status: Guidance supporting the DAM policy
  applies_to: Critical data assets
  url: https://www.gov.uk/government/publications/implement-a-data-quality-action-plan/data-quality-action-plan-implementation-guide
  verified: "yes"
  lifecycle: [Identify critical data, Identify rules, Assess current quality, Prioritise and set goals, Root cause and action, Report, Repeat]
  dimensions: [Completeness, Uniqueness, Consistency, Timeliness, Validity, Accuracy]
  map: {Completeness: [completeness], Uniqueness: [uniqueness], Consistency: [consistency], Timeliness: [timeliness],
        Validity: [validity], Accuracy: [accuracy]}
  scoring: Combined score (importance × impact) sets the target range; bands below target; priority = importance × impact × band
  pack: uk-dam-cda

- id: uk-cda-metadata
  name: Recording metadata to describe critical data assets
  publisher: Government Digital Service (DSIT)
  jurisdiction: UK
  sector: Cross-government
  type: guidance
  year: "2026"
  status: Guidance supporting the DAM policy
  url: https://www.gov.uk/government/publications/record-metadata-to-describe-critical-data-assets/recording-metadata-to-describe-critical-data-assets
  verified: "yes"
  dimensions: [Metadata completeness]
  map: {Metadata completeness: [metadata]}
  pack: uk-dam-cda

