# Data catalogues and data quality tools: how they connect, how to buy them, and how to avoid lock-in.
# Feeds the "Catalogues and quality tools" page (catalogues.html). Product facts are what each vendor or its
# documentation says, checked on the date shown, with sources. They are not endorsements, rankings or
# approved-supplier statements. Check again before you rely on them: products, names and owners change.
review: {last_reviewed: "2026-11-05", owner_role: "Content steward (tooling and commercial)", next_review: "2027-02-05"}

summary: "A data catalogue tells people what data exists, what it means and who owns it. A data quality tool tells them whether it is good enough to use. People need both answers in the same place, at the moment they choose the data. Most organisations already own a catalogue or a quality tool, or are about to buy one, often as part of a bundle. This page explains how the two connect, what to ask suppliers, how to test their claims and how to keep the freedom to change supplier later."

disclaimer: "Product information is taken from vendors' own documentation and announcements, and from public sources, on the date shown. It is not an endorsement, a ranking or advice to buy. Prices quoted from Digital Marketplace listings are examples only. This is not legal or commercial advice: work with your commercial and legal teams."

facts:
- text: "Lock-in is now a parliamentary concern. On 3 June 2026 the Commons Science, Innovation and Technology Committee called the public sector's reliance on a small number of large technology suppliers an unacceptable point of weakness, said vendor lock-in is not inevitable, called for a cross-public-sector strategy to end it, and highlighted serious data hygiene deficiencies."
  source: "https://committees.parliament.uk/committee/135/science-innovation-and-technology-committee/news/214048/mps-warn-that-palantirs-increasing-presence-in-the-uk-public-sector-is-an-unacceptable-point-of-weakness/"
- text: "The Competition and Markets Authority's cloud market investigation (final decision 31 July 2025) found that data egress fees and barriers to interoperability restrict switching and multi-cloud use. In March 2026 the CMA announced a package of actions, including steps by Amazon and Microsoft on egress fees and interoperability for UK customers."
  source: "https://www.gov.uk/government/news/cma-announces-package-of-actions-on-business-software-and-cloud-services"
- text: "The market is consolidating. Salesforce completed its purchase of Informatica (catalogue, quality, governance, master data) on 18 November 2025. ServiceNow agreed to buy the data.world catalogue in May 2025. Qlik bought Talend in 2023. A change of owner can change roadmaps, bundles and prices, so contracts need to plan for it."
  source: "https://www.businesswire.com/news/home/20251118759580/en"
- text: "The big cloud and data platforms now include their own catalogue and data quality features: Microsoft Purview Unified Catalog, Google Knowledge Catalog (formerly Dataplex Universal Catalog), AWS Glue Data Quality with Amazon SageMaker Catalog, Databricks Unity Catalog and Snowflake Horizon. They are convenient, but they tie quality to one platform unless you plan otherwise."
  source: "https://learn.microsoft.com/purview/unified-catalog-data-quality"
- text: "Open standards now cover the main joins between tools: the Open Data Contract Standard (ODCS, version 3.1) for rules and expectations, OpenLineage for lineage and quality results from pipelines, W3C DCAT and DQV for catalogue records and quality measurements, and the Apache Iceberg REST catalog specification for tables. Asking for them is the most effective single protection against lock-in."
  source: "https://bitol.io/bitol-announces-odcs-v3-1-0-stronger-smarter-and-stricter/"
- text: "Check vendor facts at source. While researching this page the Commons found an AI-generated vendor profile stating that one data quality vendor had been bought by a competitor; it had not. Use vendors' own documentation, official notices and the Digital Marketplace, and ask suppliers to confirm claims in writing."
  source: ""

# How catalogue and quality tools are put together, from most to least locked in.
patterns:
- id: bundle
  name: "Single-vendor suite"
  lockin: 5
  what: "One vendor sells catalogue, quality and often master data, lineage and integration as one platform, priced together."
  examples: ["Ataccama ONE", "Informatica IDMC (Salesforce)", "Collibra", "IBM watsonx.data intelligence", "Precisely Data Integrity Suite", "Qlik Talend Cloud"]
  good: "One user interface; quality results map to catalogue assets automatically; one supplier to manage."
  watch: "Rules, results and glossaries may only exist in the vendor's format; modules are often priced as a bundle or from a shared pool of consumption units; leaving means replacing several capabilities at once."
  when: "A large organisation that wants one supported platform and can negotiate strong export, exit and module-by-module pricing terms."
- id: platform
  name: "Platform-native"
  lockin: 4
  what: "The cloud or data platform you already use provides the catalogue and quality checks, running next to the data."
  examples: ["Microsoft Purview Unified Catalog", "Google Knowledge Catalog", "AWS Glue Data Quality and SageMaker Catalog", "Databricks Unity Catalog", "Snowflake Horizon"]
  good: "No data movement; pay as you go; quick to start; security inherited from the platform."
  watch: "Quality runs only on that platform's data, or is limited elsewhere; costs are consumption-based and can grow quietly; some features need a premium edition; multi-cloud estates end up with several catalogues."
  when: "Most of your critical data sits on one platform and you accept that platform as a long-term choice."
- id: partner
  name: "Catalogue with partner quality tools"
  lockin: 3
  what: "A specialist catalogue shows results from quality and observability tools you choose, through a published integration framework or API."
  examples: ["Alation Open Data Quality Framework", "Atlan (with Anomalo, Monte Carlo, Soda, Ataccama)", "data.world"]
  good: "Choose the best quality tool for each team; change quality tool without changing catalogue."
  watch: "Integration depth varies from a link to full two-way working; two contracts and two roadmaps; the catalogue may also sell its own quality module that competes with partners."
  when: "You want a business-friendly catalogue and already have, or want to keep, separate quality tools."
- id: open
  name: "Open-source catalogue and quality tools"
  lockin: 2
  what: "An open-source catalogue receives results from open-source or any other quality tools through documented APIs, hosted by you or by a support supplier."
  examples: ["DataHub", "OpenMetadata", "Great Expectations", "Soda Core", "dbt tests", "The Commons toolkit (dqkit)"]
  good: "No licence lock-in; code and data formats are inspectable; communities share connectors; you can buy support from several suppliers."
  watch: "You need skills to host, upgrade and secure it, or a support contract; some advanced features are only in the commercial editions."
  when: "You have, or can buy, engineering capacity and want maximum control, transparency and reuse across government."
- id: standards
  name: "Standards-first (any tools)"
  lockin: 1
  what: "Whatever tools you buy, rules live in an open contract format, lineage and results are exchanged in open formats, and tables use open table formats, so any compliant tool can take over."
  examples: ["ODCS for rules", "OpenLineage for lineage and run results", "DCAT and DQV for catalogue records and quality results", "Apache Iceberg with a REST catalog for tables"]
  good: "Tools become replaceable parts; quality history survives a change of supplier; easier to share across organisations."
  watch: "Not every product supports every standard yet; you must specify, test and contract for it."
  when: "Always, as the target. Combine it with any of the patterns above."

# How deep an integration really is. Ask suppliers to show which level they reach, with your data.
depth:
- level: 0
  name: "Separate"
  what: "No connection. People look in two places, or quality is reported in spreadsheets."
- level: 1
  name: "Link-out"
  what: "The catalogue page links to the quality tool. Nothing is shown in the catalogue itself."
- level: 2
  name: "Display"
  what: "Quality scores, check results or trust badges appear on the catalogue's asset pages, refreshed on a schedule."
- level: 3
  name: "Two-way"
  what: "Rules can be defined or run from the catalogue; results, incidents and owners flow back and are mapped to columns and critical data elements."
- level: 4
  name: "Governed and portable"
  what: "Quality is tied to policies, data contracts and lineage impact, alerts reach the named owner, and rules, results and metadata can be exported in open standards."

