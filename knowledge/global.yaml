commonwealth:
  summary: >-
    A voluntary association of 56 independent countries, supported by the Commonwealth Secretariat. Its Data Platform
    brings together datasets from sources such as the World Bank and IMF, with dashboards and visualisations.
  links:
  - {title: "The Commonwealth: about us", url: "https://thecommonwealth.org/about-us", checked: listed}
  - {title: "Commonwealth Data Platform", url: "https://data.thecommonwealth.org/", checked: "yes"}

# Bodies and frameworks the UK works with, by level. type: framework, network, body.
partners:
- {id: un-fpos, level: International, type: framework, name: "UN Fundamental Principles of Official Statistics", use: "Ten principles behind every national statistics code, including relevance, impartiality and professional standards.", url: "https://unstats.un.org/fpos/", pack: "", checked: listed}
- {id: un-nqaf, level: International, type: framework, name: "UN National Quality Assurance Frameworks Manual (2019)", use: "A template quality framework any statistics office can adopt; useful for small offices without their own.", url: "https://desapublications.un.org/publications/united-nations-quality-assurance-frameworks-manual", pack: "un-nqaf", checked: listed}
- {id: unsc, level: International, type: body, name: "UN Statistical Commission", use: "The top body of the global statistical system; endorsed the NQAF manual in 2019.", url: "https://unstats.un.org/UNSDWebsite/statcom", pack: "", checked: listed}
- {id: imf-dqaf, level: International, type: framework, name: "IMF Data Quality Assessment Framework and data standards (SDDS Plus)", use: "Five quality dimensions plus prerequisites; the UK adheres to the IMF's highest data dissemination standard.", url: "https://dsbb.imf.org/", pack: "imf-dqaf", checked: listed}
- {id: oecd, level: International, type: framework, name: "OECD Recommendation on Good Statistical Practice", use: "Good practice for national statistical systems, used in OECD peer reviews.", url: "https://legalinstruments.oecd.org/en/instruments/OECD-LEGAL-0417", pack: "", checked: listed}
- {id: unece, level: International, type: network, name: "UNECE High-Level Group for the Modernisation of Official Statistics", use: "Shared models (GSBPM, GSIM) and quality work for modern statistics production.", url: "https://unece.org/statistics/modernization-of-official-statistics", pack: "", checked: listed}
- {id: paris21, level: International, type: network, name: "PARIS21", use: "Capacity building for statistics in lower-income countries, including small island states.", url: "https://www.paris21.org/", pack: "", checked: listed}
- {id: gpsdd, level: International, type: network, name: "Global Partnership for Sustainable Development Data", use: "Partnerships to fill data gaps for the Sustainable Development Goals.", url: "https://www.data4sdgs.org/", pack: "", checked: listed}
- {id: who-score, level: International, type: framework, name: "WHO SCORE for health data", use: "Technical package to strengthen country health information systems and data quality.", url: "https://www.who.int/data/data-collection-tools/score", pack: "", checked: listed}
- {id: digital-nations, level: International, type: network, name: "Digital Nations", use: "Leading digital governments sharing practice; its charter commits to user needs, open standards, open source and sharing.", url: "https://www.leadingdigitalgovs.org/", pack: "", checked: "yes"}
- {id: ogp, level: International, type: network, name: "Open Government Partnership", use: "The UK was a founding member in 2011; national action plans often include open data quality commitments.", url: "https://www.opengovpartnership.org/members/united-kingdom/", pack: "", checked: listed}
- {id: g7-dfft, level: International, type: network, name: "G7 Data Free Flow with Trust", use: "Trusted cross-border data flows; trust depends on known data quality and provenance.", url: "https://www.oecd.org/en/topics/sub-issues/cross-border-data-flows.html", pack: "", checked: listed}
- {id: g20-dgi, level: International, type: network, name: "G20 Data Gaps Initiative", use: "Closing gaps in economic and financial statistics across G20 economies.", url: "https://www.imf.org/en/News/Seminars/Conferences/g20-data-gaps-initiative", pack: "", checked: listed}
- {id: ess-cop, level: Supranational, type: framework, name: "European Statistics Code of Practice", use: "The EU's statistics code. Relevant for comparability and, through the Windsor Framework, some Northern Ireland data.", url: "https://ec.europa.eu/eurostat/web/quality/european-quality-standards/european-statistics-code-of-practice", pack: "ess-output-quality", checked: listed}
- {id: coe-108, level: Supranational, type: framework, name: "Council of Europe Convention 108+", use: "The international data protection treaty, which includes data accuracy as a principle.", url: "https://www.coe.int/en/web/data-protection/convention108-and-protocol", pack: "", checked: listed}
- {id: iso, level: International, type: body, name: "ISO and IEC (ISO 8000, ISO/IEC 25012, ISO/IEC 5259)", use: "International data quality standards, available as packs in the toolkit.", url: "https://www.iso.org/standard/50798.html", pack: "iso-8000-8", checked: listed}
- {id: w3c, level: International, type: body, name: "W3C (DCAT, DQV, CSVW, PROV)", use: "Open web standards for describing data and its quality; used by the Metadata Weaver.", url: "https://www.w3.org/TR/vocab-dcat-3/", pack: "", checked: "yes"}
- {id: ireland, level: National, type: body, name: "Ireland: Central Statistics Office", use: "Neighbour and partner; all-island data for Northern Ireland and Ireland needs comparable definitions and quality.", url: "https://www.cso.ie/", pack: "", checked: listed}

how_to_join:
- "Use everything on the Commons now: no account, no cost, nothing uploaded."
- "Choose a framework pack for your jurisdiction, or ask us to add one through Help us build this."
- "Share a case study or resource. Tell us your jurisdiction so others can find it."
- "Join a co-design session. We rotate times so people in different time zones can take part."
- "Translate or adapt content. Everything is open (OGL v3.0 and MIT), so you can reuse it locally."
