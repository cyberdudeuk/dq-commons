# UK and the world: who the Commons is for beyond UK government, and the partners the UK works with.
# Honesty rules: "checked: yes" means the source was read when added; "listed" means found by search, not yet read
# in full (shown as "Not yet reviewed"). We never assume UK law or UK frameworks apply outside the UK.
review: {last_reviewed: "2026-10-15", owner_role: Content steward (international)}

summary: >-
  Data quality matters wherever public services are delivered. The Commons is open to the UK's Crown Dependencies,
  Overseas Territories, Commonwealth partners, and the national, international and supranational bodies the UK works
  with. Each has its own laws, constitution, statistics system and data protection rules. The toolkit is neutral:
  you choose the framework pack that fits where you are.

principles:
- {id: P1, title: "Respect each jurisdiction", text: "Crown Dependencies and Overseas Territories have their own constitutions, governments and laws. Nothing here assumes UK law, UK policy or UK frameworks apply to them."}
- {id: P2, title: "Your framework, your choice", text: "Pick the pack that fits: a local code of practice, the UN national quality assurance framework, the IMF data quality framework, or the UK government framework."}
- {id: P3, title: "Small teams first", text: "Many small jurisdictions have a statistics office of a handful of people. Everything works in a browser, free, with no install and nothing uploaded."}
- {id: P4, title: "Share both ways", text: "Good practice flows in every direction. Small island statistics offices, Commonwealth partners and international bodies are contributors, not only users."}
- {id: P5, title: "Data protection differs", text: "Jersey, Guernsey and the Isle of Man have their own data protection laws, and the Overseas Territories have their own regimes. Check yours before sharing any personal data."}
- {id: P6, title: "No one left out", text: "Smaller places are often missing from UK-wide data. The inclusion checks flag places and groups that disappear in totals."}

