# Data quality across the professions: where data quality sits in each profession's capability framework,
# in the UK nations and sectors, and internationally.
# Honesty rules: every entry was read at source on checked_on. "where" says only what the source says;
# "capabilities" is the Commons' mapping to the data quality capability set below (an interpretation, marked as such
# on the page). Roles only, never named people. Update when a framework is revised.
review:
  last_reviewed: '2026-11-03'
  owner_role: Content steward (learning)

intro: >-
  Data quality is not one profession's job. The Government Data Quality Framework calls for a culture where everyone
  who collects, manages or uses data plays a part. Many professions already describe data quality skills in their
  capability frameworks, usually under other names: quality assurance, data preparation, evidence, data standards.

# The data quality capability set: the sub-capabilities named by the Government Data Quality Framework and by the
# open standards and bodies of knowledge used in the UK and internationally.
capabilities:
- {id: C1, name: Data quality strategy and governance, what: "Set policy, roles (owner, steward), targets and a data quality action plan", gdqf: Commit to data quality, dama: Define a data quality strategy; governance, iso: ISO 8000-61 data quality planning; ISO 8000-150 roles}
- {id: C2, name: Data profiling and assessment, what: "Measure data against dimensions and record a baseline", gdqf: Assess quality throughout the data life cycle, dama: Perform an initial data quality assessment; profiling, iso: ISO 8000-61 data quality monitoring and control}
- {id: C3, name: "Rules, validation and standards", what: "Write testable rules and apply data standards and controls at source", gdqf: Assess quality throughout the data life cycle, dama: Identify critical data and business rules, iso: ISO 8000-8 information and data quality concepts and measuring}
- {id: C4, name: Data quality monitoring and analytics, what: "Track quality over time, analyse trends and set alerts", gdqf: Assess quality throughout the data life cycle, dama: Measure and monitor data quality, iso: ISO 8000-61 data quality monitoring and control}
- {id: C5, name: Issue management and root cause, what: "Log, prioritise and fix issues at source; prevent recurrence", gdqf: Assess quality throughout the data life cycle, dama: Identify and prioritise potential improvements; root cause analysis, iso: ISO 8000-61 data quality improvement}
- {id: C6, name: "Cleansing, linkage and enrichment", what: "Correct, standardise, deduplicate and link records", gdqf: Assess quality throughout the data life cycle, dama: Develop and deploy data quality operations, iso: ISO 8000-61 data quality improvement}
- {id: C7, name: Reporting and communicating quality, what: "Publish quality statements, caveats and dashboards people can understand", gdqf: Communicate quality clearly and effectively, dama: Report on data quality levels and findings, iso: ISO 8000-8 measuring and reporting}
- {id: C8, name: Metadata and documentation, what: "Describe data so others can find, judge and reuse it", gdqf: Know your users and their needs, dama: Metadata management (supports data quality), iso: ISO 8000-110 and 115 for master data}
- {id: C9, name: Quality assurance of analysis and evidence, what: "Check that inputs, methods and outputs are fit for the decision", gdqf: Know your users and their needs, dama: Data quality in analytics, iso: ISO/IEC 25012 data quality model}
- {id: C10, name: Inclusion and representativeness, what: "Check who data leaves out or misrecords, and fix it", gdqf: Know your users and their needs, dama: Not a named activity, iso: ISO/IEC 5259 (data quality for AI) covers representativeness}
- {id: C11, name: Data quality in contracts and suppliers, what: "Put data quality duties and measures into contracts", gdqf: Anticipate changes affecting quality, dama: Data quality in data acquisition, iso: ISO 8000-1 to 8000-8 for data requirements in exchange}
- {id: C12, name: Data literacy and culture, what: "Build skills and a culture where quality is everyone's job", gdqf: Commit to data quality, dama: Data quality culture and training, iso: ISO 8000-150 responsibility groups}

# How each framework's levels line up with the Commons' three audiences.
levels:
  audiences: [Beginner, Intermediate, Advanced]
  scales:
  - {framework: Government Digital and Data (GDaD), beginner: Awareness, intermediate: "Working; Practitioner", advanced: Expert}
  - {framework: Policy Profession Standards, beginner: "Level 1: Developing", intermediate: "Level 2: Practitioner", advanced: "Level 3: Expert"}
  - {framework: Project Delivery Capability Framework, beginner: Awareness, intermediate: "Working; Practitioner", advanced: Expert}
  - {framework: Government Counter Fraud Profession, beginner: "Trainee; Foundation", intermediate: Practitioner, advanced: Advanced practitioner}
  - {framework: APS Data Capability Framework (Australia), beginner: Foundation, intermediate: Intermediate, advanced: Advanced}
  - {framework: GC Data Competency Framework (Canada), beginner: Foundational, intermediate: Intermediate, advanced: Advanced}
  - {framework: SFIA 9, beginner: "Levels 1 to 2", intermediate: "Levels 3 to 4", advanced: "Levels 5 to 7"}
  - {framework: JNCC Data Skills Framework (UK), beginner: Foundation, intermediate: Intermediate, advanced: Advanced}

professions:
# ---------- UK Civil Service professions and functions ----------
- id: gdad
  group: UK Civil Service profession
  name: Government Digital and Data (GDaD)
  framework: Government Digital and Data Profession Capability Framework
  url: https://understand-digital-data-roles-skills.service.gov.uk/
  where: >-
    There is no standalone data quality skill. Data quality sits inside other skills: for data analysts, "data preparation
    and linkage" (identify and resolve data quality issues; at principal level, set data quality standards); for data
    governance managers, "data governance", "data management", "data maturity" and "data standards", with the role
    expected to establish data management competencies such as data quality. "Metadata management" and "data compliance
    and security" are separate skills. The framework moved to a new address and was last updated on 30 September 2026.
  roles: [Data analyst, Data governance manager, Data engineer, Performance analyst, Data architect, Analytics engineer]
  capabilities: [C1, C2, C3, C5, C6, C8, C12]
  personas: [steward, analyst, governance, cdo]
  levels: GDaD
  insight: "A named data quality skill would make the capability visible in job descriptions and skills audits. The framework invites change proposals."
  checked_on: '2026-11-03'
