    analysis, manage the risks in producing them, and promote a culture of quality assurance, including advising
    non-analytical professions. The AQuA Book on analytical quality assurance was updated in 2024 to 2025.
  roles: [Senior analysts across the analytical professions]
  capabilities: [C1, C7, C9, C12]
  personas: [statistician, analyst, cdo]
  checked_on: '2026-11-03'
