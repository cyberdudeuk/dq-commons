tutorials:
- id: t1
  title: Run your first check in the browser
  minutes: 5
  steps:
  - Open Check your data. An NDL example is already loaded.
  - "Choose another example, or load your own CSV or spreadsheet. Nothing leaves your browser."
  - Press Run the checks. Read the trust level, the route and each rule's pass rate against its target.
  - Open a failing rule's examples to see the rows that failed.
  - Copy the DQV metadata or DQAP rows to take the results with you.
- id: t2
  title: Turn plain English into rules
  minutes: 10
  steps:
  - "Open the assistant (or Check your data, then Describe your rules)."
  - "Describe what good looks like, for example: every claim has a valid NI number and a date not in the future."
  - The assistant drafts a rules file and the page checks it with the kit before you see it.
  - Review every rule. Add purposes and set the importance of the asset.
  - Run the checks. Keep the rules file; the pipeline uses the same file.
- id: t3
  title: Measure your assets every week
  minutes: 20
  steps:
  - Add a line per asset to a portfolio file (rules file, data source, schedule, packs).
  - Run python -m dqkit run your-portfolio.yaml locally and read run-summary.md.
  - Push the repository to GitHub and switch on Actions and Pages (see the operating model page).
  - Overdue issues become GitHub issues; the portal rebuilds after each run.
- id: t4
  title: Report in another framework's terms
  minutes: 5
  steps:
  - Open Frameworks and standards and pick a framework, for example ISO/IEC 25012.
  - See how its dimensions map to the kit's.
  - "From the command line: python -m dqkit crosswalk results.json --to iso-iec-25012"
  - Dimensions the data rules can't measure are listed so you can gather other evidence.
- id: t5
  title: Check your organisation's maturity
  minutes: 10
  steps:
  - Open the Maturity check and choose the statement that fits best for each of the 8 themes.
  - Read your level per theme and the recommended next steps.
  - Optionally share an anonymous result to help build the cross-sector picture.
- id: t6
  title: Contribute to the library
  minutes: 5
  steps:
  - Open Community, then Library.
  - Add a case study, rule pattern, insight, resource or framework note.
  - Choose who it covers (sector, nation) and whether it can be shared publicly.
  - The Commons team reviews it before it shows as published.
- id: t7
  title: Use the kit from an AI agent
  minutes: 10
  steps:
  - Start the kit's MCP server - python -m dqkit.mcp_server.
  - Add it to your agent or Claude as a local MCP server.
  - Ask the agent to check a file, suggest rules, assess against a pack or translate results.

glossary:
- {term: Accuracy, definition: "How well data describes the real thing or event it is about."}
- {term: Completeness, definition: "How much of the data that should be there is there."}
- {term: Consistency, definition: "Whether the same thing is recorded the same way in different places."}
- {term: Timeliness, definition: "Whether data describes reality at the time it is needed."}
- {term: Uniqueness, definition: "Nothing is recorded more than once."}
- {term: Validity, definition: "Data follows its agreed format, type and allowed values."}
- {term: Representativeness, definition: "Data covers the groups of people or places it should, without gaps that hide some of them."}
- {term: Critical data asset (CDA), definition: "A data asset of high value shared across government, in scope of the DAM policy."}
- {term: Data quality action plan (DQAP), definition: "The plan that records an asset's rules, baseline, issues, actions and reporting."}
- {term: Data quality issues framework, definition: "GOV.UK method that sets targets from importance and impact, then scores how far below target a rule is."}
- {term: Combined score, definition: "Importance of purpose (1-4) times impact of the rule failing (1-4)."}
- {term: Trust level, definition: "Untrustworthy, Requires improvement, Useable or Trustworthy - says how data may be used and shared."}
- {term: Control point, definition: "Where a control belongs - at source (capture), in the pipeline, or in reporting."}
- {term: Escalation, definition: "Raising an issue to the data owner or governance board when it stays open longer than allowed."}
- {term: DQV, definition: "W3C Data Quality Vocabulary - a standard way to publish quality results as metadata."}
- {term: DCAT, definition: "W3C vocabulary for describing datasets in catalogues."}
- {term: Pack, definition: "A profile that applies a framework, standard or scenario to the kit's results."}
- {term: Crosswalk, definition: "A table that maps one framework's dimensions or terms to another's."}
- {term: QAAD, definition: "Quality Assurance of Administrative Data - OSR's toolkit and assurance levels A0 to A3."}
- {term: DQMI, definition: "NHS England's Data Quality Maturity Index for provider datasets."}
- {term: Data owner, definition: "The senior person accountable for an asset's fitness, priorities and acceptable risk."}
- {term: Data steward, definition: "The person who runs the quality work day to day - rules, measurement, issues and reporting."}
- {term: Root cause analysis, definition: "Finding why an issue happens (process, system or people) so the fix prevents it coming back."}
- {term: Containment, definition: "A quick action that limits harm while the real fix is made."}
- {term: MCP, definition: "Model Context Protocol - a standard way for AI agents to call tools such as this kit."}
- {term: Declarative, definition: "Saying what good looks like (rules, portfolios, packs) and letting the tools work out how to check it."}
