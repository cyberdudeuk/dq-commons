# Learning pathway, tutorials and glossary for data quality management and its neighbouring capabilities.
# Skill levels follow the Government Digital and Data profession: Awareness, Working, Practitioner, Expert.

levels: [Awareness, Working, Practitioner, Expert]

roles:
- {id: owner, name: Data owner, needs: "Decide priorities, accept risk, sign off the DQAP and act on escalations", level: Working}
- {id: steward, name: Data steward, needs: "Write rules, run checks, log and work issues, report", level: Practitioner}
- {id: analyst, name: Data analyst or engineer, needs: "Automate checks in pipelines, profile data, investigate root causes", level: Practitioner}
- {id: statistician, name: Statistician or analyst producing statistics, needs: "Assure sources (QAAD), state quality to users, meet the Code of Practice", level: Practitioner}
- {id: governance, name: Data governance manager, needs: "Run the DQ operating model, policy compliance and reporting across the organisation", level: Expert}
- {id: cdo, name: Chief data officer or senior responsible owner, needs: "Set direction, fund improvement, report to boards and the CDO Council", level: Working}
- {id: product, name: Service or product owner, needs: "Prevent poor data at source in the service, and act on user impact", level: Awareness}
- {id: ai, name: AI or data science lead, needs: "Prove data is fit to train or feed a model, including fairness across groups", level: Practitioner}

modules:
