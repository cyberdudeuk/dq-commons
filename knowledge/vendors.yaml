ai_patterns:
  - title: "Ground agents in the catalogue, not a schema dump"
    text: "Point agents at the catalogue's MCP server so answers use governed names, owners, classifications and quality scores."
  - title: "Read-only first"
    text: "Start with read-only MCP tools (search, lineage, quality status). Allow writes such as rule creation only with human review."
  - title: "Least privilege"
    text: "Give each agent its own identity. MCP servers that respect the user's existing permissions keep access rules in one place."
  - title: "Keep rules portable"
    text: "Write rules once in the Commons format and weave them out, so you can change platform without rewriting your checks."
  - title: "Record what agents did"
    text: "Log agent actions alongside the data quality action plan, so changes can be audited and explained."
