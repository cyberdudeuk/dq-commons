# Vendor connectors, weaves and AI (agent and MCP) offerings.
# Every fact has a public source and a checked date. Analyst positions come only from the analyst's own
# public abstract or from the vendor's own announcement; no analyst graphic or text is copied.
# Rechecked by routine RT-VENDORS (every 3 months, and when a new Magic Quadrant or Wave is published).
review: {last_reviewed: "2026-11-07", owner_role: Commons maintainers (supplier and market facts), next_due: "2027-02-07"}
as_of: "2026-11-07"
review_every: P3M
summary: >-
  The platforms that public bodies are most likely to meet, starting with the vendors in the 2026 Gartner
  Magic Quadrant for Augmented Data Quality Solutions and the Forrester Wave for Data Quality Solutions (Q1 2026),
  then the catalogues and data platforms they connect to. For each one: how to get Commons rules into it
  (a weave), the open-source repositories it publishes, and what its AI agents and MCP servers can do for
  data cataloguing and metadata management.
disclaimer: >-
  Inclusion is not endorsement. The Commons is vendor-neutral and buys nothing. Analyst reports are
  opinions of their authors; positions are shown only where publicly confirmed. Product facts change
  quickly: check the linked source before relying on any of them.
legend:
  mcp:
    ga: "Generally available from the vendor"
    preview: "Vendor preview or on request"
    open-source: "Vendor-published open-source server you run yourself"
    not-found: "No first-party MCP server found in public sources on the checked date"
  weave:
    native: "A dqkit weave writes the platform's own rule format"
    sql: "Use the SQL rule pack (the platform accepts SQL-defined rules)"
    mapping: "Map by hand using the crosswalk; no importable format"

reports:
  - id: gartner-adq-2026
    short: Gartner MQ 2026
    title: Gartner Magic Quadrant for Augmented Data Quality Solutions
    published: "2026-02-11"
    analysts: Sue Waite, Divya Radhakrishnan, Amy Bickel
    vendors_evaluated: 13
    vendors: [Ab Initio Software, Acceldata, Anomalo, Ataccama, CluedIn, DQLabs, Experian, IBM, Irion, Precisely, Qlik, Salesforce (Informatica), Soda]
    note: "Vendor list from Gartner's public abstract. Positions only where the vendor has announced them."
    source: https://www.gartner.com/en/documents/7429962
  - id: gartner-adq-2025
    short: Gartner MQ 2025
    title: Gartner Magic Quadrant for Augmented Data Quality Solutions (previous edition)
    published: "2025-03-10"
    analysts: Melody Chien, Divya Radhakrishnan, Sue Waite
    vendors_evaluated: 12
    vendors: [Ab Initio, Anomalo, Ataccama, CluedIn, DQLabs, Experian, IBM, Informatica, Irion, Precisely, Qlik, SAS]
