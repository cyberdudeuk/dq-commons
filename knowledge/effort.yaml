# Effort model for the first data quality baseline of each critical data asset (CDA).
# Used by the baseline page (interactive), dqkit/effort.py (scenarios for briefings) and the CDO Council brief.
# Honesty: GOV.UK publishes no time estimates. Days per activity are typical data quality assessment effort,
# stated as assumptions people can change. Tiers: A measured, B partial, C unmeasured.
review:
  last_reviewed: '2026-10-30'
  owner_role: Data quality lead (Commons)
deadline: '2027-01-29'
deadline_note: The January 2027 baseline return date comes from the project's cataloguing playbook timeline. Confirm with GDS.
defaults:
  cdas: 499
  tier_mix: [15, 45, 40]
  critical_items: 15
  contingency: 20
  capacity_fte: 60
  lag_days: 7
scale_exponent: 0.7
central: {per_cda_days: 0.1, fte_for_window: 3}
lite_items_cap: 5
activities:
- {n: Confirm purpose and critical data items, s: '1', r: Steward, d: [0.5, 1, 2.5], lite: 0.6, sc: false, kit: 1}
- {n: "Write rules, choose dimensions, set targets", s: '2', r: Steward, d: [0.5, 2, 5], lite: 0.4, sc: true, kit: 0.6}
- {n: Get data access and a place to measure, s: '3', r: Technical, d: [0.25, 1, 3], lite: 1, sc: false, kit: 1}
- {n: Run baseline measurement, s: '3', r: Technical, d: [0.25, 1.5, 4], lite: 0.4, sc: true, kit: 0.6}
- {n: Log and score issues, s: 3–4, r: Steward, d: [0.25, 1, 2], lite: 0.5, sc: true, kit: 0.3}
- {n: Equality and coverage check, s: '3', r: Analyst, d: [0.25, 0.5, 1], lite: 1, sc: false, kit: 0.7}
- {n: Data owner review and sign-off, s: '6', r: Data owner, d: [0.25, 0.5, 1], lite: 0.5, sc: false, kit: 1}
- {n: "Complete return, department assures ALBs", s: '6', r: Coordinator, d: [0.25, 0.5, 1], lite: 0.8, sc: false, kit: 0.7}
- {n: "Record Q-FAIR fields: access route, standards, licence, provenance", s: '1, 6', r: Steward, d: [0.1, 0.25, 0.5], lite: 1, sc: false, kit: 0.8}
