# Standards catalogue: the data, digital, cyber and technology standards used across UK government and the wider
# public sector, linked to the metadata Rosetta, the Metadata Weaver, the GOV.UK open standards lists and the
# Data Standards Authority's standards catalogue. Shown on the Interoperability page ("Standards catalogue").
# Public facts only: names, publishers, status in UK government and links. Status words:
#   Mandated     a GOV.UK open standard mandated for government use (comply or explain)
#   Recommended  a GOV.UK recommended open standard
#   UK guidance  required or expected by UK government guidance (for example the Service Standard)
#   Widely used  an open or international standard widely used in the UK public sector, not formally selected
# Each entry links to the Rosetta concepts it expresses (knowledge/rosetta.yaml), whether the Weaver reads or
# writes it, and whether the GitHub Repos Asset Catalogue tracks its use in public code.
review:
  last_reviewed: 2026-11-05
  owner_role: Content steward (standards)
  next_step: Check statuses against the GOV.UK open standards collection and the Data Standards Authority standards catalogue each quarter.

sources:
  - {id: open, title: "Open standards for government data and technology (GOV.UK collection)", url: "https://www.gov.uk/government/collections/open-standards-for-government-data-and-technology"}
  - {id: mandated, title: "Open standards for government (mandated profiles)", url: "https://www.gov.uk/government/publications/open-standards-for-government"}
  - {id: recommended, title: "Recommended open standards for government", url: "https://www.gov.uk/government/publications/recommended-open-standards-for-government"}
  - {id: dsa, title: "Data Standards Authority: standards catalogue", url: "https://www.gov.uk/government/publications/data-standards-authority-standards-catalogue/standards-catalogue"}
  - {id: catalogue-profile, title: "Using metadata to describe data assets in a data catalogue (recommended profile; names DQV alongside DCAT)", url: "https://www.gov.uk/government/publications/recommended-open-standards-for-government/using-metadata-to-describe-data-assets-in-a-data-catalogue"}
  - {id: principles, title: "Open standards principles", url: "https://www.gov.uk/government/publications/open-standards-principles"}
  - {id: tcop, title: "Technology Code of Practice", url: "https://www.gov.uk/guidance/the-technology-code-of-practice"}
  - {id: api, title: "API technical and data standards", url: "https://www.gov.uk/guidance/gds-api-technical-and-data-standards"}

domains:
  - {id: data, name: Data, hue: 2, topics: [{id: meta, name: "Metadata and cataloguing"}, {id: quality, name: "Data quality and provenance"}, {id: format, name: "Formats and exchange"}, {id: ref, name: "Identifiers and reference data"}, {id: stats, name: "Statistics and research"}, {id: geo, name: "Geospatial"}, {id: sector, name: "Sector and domain data"}]}
  - {id: digital, name: Digital, hue: 4, topics: [{id: service, name: "Services and accessibility"}, {id: docs, name: "Documents and publishing"}]}
  - {id: cyber, name: Cyber, hue: 5, topics: [{id: assure, name: "Assurance"}, {id: crypto, name: "Cryptography and transport"}, {id: intel, name: "Threat intelligence and disclosure"}, {id: supply, name: "Software supply chain"}]}
  - {id: tech, name: Technology, hue: 3, topics: [{id: api, name: "APIs and integration"}, {id: arch, name: "Architecture and operations"}]}

standards:
