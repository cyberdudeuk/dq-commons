  - {id: mem, name: "UK Cross-Government Metadata Exchange Model", domain: data, topic: meta, publisher: "Data Standards Authority", status: UK guidance, url: "https://co-cddo.github.io/ukgov-metadata-exchange-model/", source: catalogue-profile, concepts: [C003, C010, C011, C012, C032, C058], weaver: out, rosetta: "UK MEM / x-gov", note: "DCAT-based; the Weaver's UK CDA profile check applies the critical data asset values."}
  - {id: dqv, name: "DQV (Data Quality Vocabulary)", domain: data, topic: quality, publisher: W3C, status: Widely used, url: "https://www.w3.org/TR/vocab-dqv/", source: catalogue-profile, concepts: [C026, C027, C028, C029, C030], weaver: out, catalogue: "DQV", rosetta: "DQV", note: "A W3C Note, not itself a selected UK open standard, but named alongside DCAT in the recommended profile for describing data assets in a data catalogue. The toolkit writes data quality results as DQV and the Weaver writes metadata quality as DQV."}
  - {id: dcatap, name: "DCAT-AP (application profile for European data portals)", domain: data, topic: meta, publisher: "European Commission (SEMIC)", status: Widely used, url: "https://semiceu.github.io/DCAT-AP/releases/3.0.0/", concepts: [C001, C003, C005, C034], weaver: check, rosetta: "DCAT-AP"}
  - {id: geodcat, name: "GeoDCAT-AP", domain: data, topic: geo, publisher: "European Commission (SEMIC)", status: Widely used, url: "https://semiceu.github.io/GeoDCAT-AP/releases/", concepts: [C020, C039], weaver: out, rosetta: "GeoDCAT-AP"}
  - {id: statdcat, name: "StatDCAT-AP", domain: data, topic: stats, publisher: "European Commission (SEMIC)", status: Widely used, url: "https://github.com/SEMICeu/StatDCAT-AP", concepts: [C003, C021], weaver: out, rosetta: "StatDCAT-AP", note: "A version 3.0 is in revision."}
  - {id: dcatus, name: "DCAT-US (Project Open Data metadata schema)", domain: data, topic: meta, publisher: "US government", status: Widely used, url: "https://resources.data.gov/resources/dcat-us/", concepts: [C003], weaver: none, rosetta: "DCAT-US", note: "Included for international comparison only."}
  - {id: dc, name: "Dublin Core metadata terms", domain: data, topic: meta, publisher: DCMI, status: Widely used, url: "https://www.dublincore.org/specifications/dublin-core/dcmi-terms/", concepts: [C007, C008, C009, C014, C016], weaver: both, catalogue: "Dublin Core", note: "DCAT reuses Dublin Core terms (dct:)."}
  - {id: schemaorg, name: "schema.org Dataset", domain: data, topic: meta, publisher: "schema.org community", status: Widely used, url: "https://schema.org/Dataset", concepts: [C003, C007, C008], weaver: both, catalogue: "schema.org", note: "Used for search-engine discovery of published data; also the basis of the mandated job vacancy profile."}
  - {id: ckan, name: "CKAN API and metadata schema", domain: data, topic: meta, publisher: "CKAN project (Open Knowledge Foundation)", status: Widely used, url: "https://docs.ckan.org/en/latest/api/", concepts: [C001, C003, C005], weaver: both, catalogue: "CKAN API", note: "data.gov.uk runs on CKAN."}
  - {id: skos, name: "SKOS (Simple Knowledge Organization System)", domain: data, topic: meta, publisher: W3C, status: Widely used, url: "https://www.w3.org/TR/skos-reference/", concepts: [C015], weaver: none, catalogue: "SKOS", note: "Code lists, taxonomies and thesauri; the Commons knowledge map uses it."}
  - {id: odrl, name: "ODRL (Open Digital Rights Language)", domain: data, topic: meta, publisher: W3C, status: Widely used, url: "https://www.w3.org/TR/odrl-model/", concepts: [C014, C031], weaver: none, catalogue: "ODRL"}
  - {id: croissant, name: "Croissant (metadata for machine learning datasets)", domain: data, topic: meta, publisher: "MLCommons", status: Widely used, url: "https://docs.mlcommons.org/croissant/docs/croissant-spec-1.1.html", concepts: [C003, C030], weaver: none, catalogue: "Croissant", note: "Extends schema.org Dataset to describe datasets for machine learning."}
