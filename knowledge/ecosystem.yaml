# Three open projects, one journey: the DQ Commons, the DAM capability playbooks and the GitHub Repos Asset Catalogue.
# A like-for-like comparison, what each could gain from the others, how they link up, the shared keys that let them
# point at each other, and journeys that start in one and continue in another. Shown on ecosystem.html; the shared
# keys are also published as api/xref.json, in the same shape as the playbooks' data/xref.json.
# The three stay separate projects with their own owners, purposes, audiences and status: they link, they don't merge.
# Reviewed against the playbooks v1.8.1 and the catalogue's open edition as published on 5 November 2026.
review:
  last_reviewed: 2026-11-05
  owner_role: Commons product owner
  next_step: Re-run the comparison at each release of any of the three, and test the cross-portal journeys with five users from each audience.

portals:
  - id: dqc
    name: Public Sector Data Quality Commons
    short: DQ Commons
    url: https://cyberdudeuk.github.io/dq-commons/
    repo: https://github.com/cyberdudeuk/dq-commons
    xref: https://cyberdudeuk.github.io/dq-commons/api/xref.json
    status: Community project
    hue: 0
    role: "Do the data quality work: check data in the browser, run the playbook, prioritise issues, describe data in every standard, buy tools well, learn and contribute."
    audience: "Data quality practitioners, stewards, owners and leaders across the UK public sector and beyond."
    licence: Code MIT; content Open Government Licence v3.0
  - id: dam
    name: DAM capability playbooks
    short: DAM playbooks
    url: https://cyberdudeuk.github.io/dam-capability-playbooks/
    repo: https://github.com/cyberdudeuk/dam-capability-playbooks
    xref: https://cyberdudeuk.github.io/dam-capability-playbooks/data/xref.json
    status: Prototype guidance for the DAM Policy
    hue: 1
    role: "Implement the Data Asset Management Policy: every requirement, step-by-step governance, cataloguing and quality methods, sector supplements, capabilities and delivery practices."
    audience: "Lead policy coordinators, chief data officers, data owners, stewards and catalogue managers in UK government."
    licence: Code MIT; content Open Government Licence v3.0
  - id: cat
    name: GitHub Repos Asset Catalogue
    short: Repos catalogue
    url: https://cyberdudeuk.github.io/github-repos-asset-catalogue/
    repo: https://github.com/cyberdudeuk/github-repos-asset-catalogue
    xref: ""
    status: Specialist evidence tool
    hue: 2
    role: "See what public bodies publish as code: find what already exists, the data management and standards evidence in code, legacy and debt, organisations and APIs."
    audience: "Policy leads, service owners, data leaders, engineering and security leads, and architects."
    licence: Code MIT; content and data Open Government Licence v3.0

# full | partial | none | notseen (not found in our review; may exist)
comparison:
  - group: Content
    rows:
      - {item: "DAM Policy requirements, step by step", dqc: [partial, "Playbook stage guidance, CDA baseline, gap register"], dam: [full, "Every requirement with its strength, source and the step that meets it"], cat: [partial, "Data and metadata management lens over public code"]}
      - {item: "Data quality method and tools", dqc: [full, "Eight-stage playbook, browser checker, issues framework, rules assistant, pipeline"], dam: [full, "Quality playbook; sector rules the Commons kit can run"], cat: [partial, "Data quality evidence and tools found in code"]}
      - {item: "Cataloguing and metadata", dqc: [full, "Metadata Weaver (DCAT, schema.org, CKAN, ODCS, DQV), 61-concept Rosetta, standards catalogue"], dam: [full, "Cataloguing playbook; proposed crosswalk to DCAT and Dublin Core (not yet agreed)"], cat: [full, "Catalogue platforms and standards graded per repository; records as DCAT JSON-LD"]}
      - {item: "Governance method", dqc: [partial, "Roles, RACI, operating model"], dam: [full, "Governance playbook with escalation and one yearly cycle"], cat: [none, ""]}
      - {item: "DAMA wheel", dqc: [full, "Seven audience views, DAM actions, maturity overlay, records lifecycle, join-up plan"], dam: [full, "Wheel shaded by DAM capabilities, role guidance, records life cycle"], cat: [full, "Wheel of code projects with evidence of each knowledge area"]}
      - {item: "Maturity", dqc: [full, "Eight-theme self-assessment with benchmarks; links to the DMA"], dam: [full, "Capability model, 32 capabilities, self-assessment, links to the DMA"], cat: [none, ""]}
      - {item: "Roles, personas and change", dqc: [full, "23 roles incl. 10 change roles, RACI, blueprint, gate questions"], dam: [full, "19 roles incl. programme roles, six routes, programme blueprint"], cat: [full, "Persona tours: policy, service, data, engineering, architecture"]}
      - {item: "Sector supplements", dqc: [partial, "Scenarios by policy, sector and platform"], dam: [full, "14 sector supplements with a finder"], cat: [partial, "Topics, public services and devolution lenses: the four nations, devolved guidance and strategic authorities on a map"]}
      - {item: "Standards and crosswalks", dqc: [full, "60-standard catalogue across data, digital, cyber and technology; Rosetta; 30 frameworks"], dam: [partial, "Open standards in tools and interoperability; proposed crosswalk"], cat: [full, "16 catalogue and metadata standards graded per repository, 41 interoperability standards tracked in public code; crosswalks and mappings on the interoperability view"]}
      - {item: "Tools, suppliers and buying", dqc: [full, "20 products, lock-in checker, RFI and RFP builder, clauses"], dam: [full, "Nine tool kinds, pairings, barriers, 23 RFI questions"], cat: [full, "Data tools and suppliers seen in code, matched to procurement notices from Find a Tender, Contracts Finder, Public Contracts Scotland and Sell2Wales"]}
      - {item: "Professions, skills and learning", dqc: [full, "Professions, skills check, courses, modules, events"], dam: [full, "DDaT pathways, learning modules"], cat: [partial, "Plain-English guide to GitHub"]}
      - {item: "Records and information management", dqc: [full, "Lifecycle, frameworks and join-up on the wheel; records manager role"], dam: [full, "Records life cycle; working together page"], cat: [none, ""]}
      - {item: "Evidence from public code", dqc: [none, ""], dam: [none, ""], cat: [full, "Every UK public sector code project, with status labels and accuracy sampling; datasets on data.gov.uk and the devolved data catalogues that name the code"]}
      - {item: "Organisations, APIs and legacy", dqc: [partial, "Legacy and modernisation guidance"], dam: [partial, "Legacy exits in delivery and change"], cat: [full, "Organisation profiles, family tree, API catalogue, legacy and debt signals"]}
  - group: Features
    rows:
      - {item: "Run checks on your own data in the browser", dqc: [full, "Nothing uploaded"], dam: [none, ""], cat: [none, ""]}
      - {item: "Search", dqc: [full, "Site-wide, keyboard shortcut"], dam: [full, "Ranked search, keyboard shortcut"], cat: [full, "Search everything"]}
      - {item: "Ask in plain English (no AI)", dqc: [full, "Ask the Commons"], dam: [notseen, ""], cat: [full, "Ask a question, answered from its data"]}
      - {item: "Guided tours, user guide, tutorials", dqc: [full, ""], dam: [full, ""], cat: [full, "Tours by persona"]}
      - {item: "Site map", dqc: [full, ""], dam: [full, ""], cat: [partial, "Hubs and views"]}
      - {item: "Share on every page", dqc: [full, "Device, link, section link, email, Teams, LinkedIn, embed, print"], dam: [full, "Link, device, email, Teams"], cat: [notseen, ""]}
      - {item: "Tooltips and display options", dqc: [partial, "Tooltips; light and dark"], dam: [full, "Tooltips; text size, spacing, colours"], cat: [full, "Tooltips on terms"]}
      - {item: "Progress tracking", dqc: [partial, "Playbook checklist ticks"], dam: [full, "Steps and modules"], cat: [none, ""]}
      - {item: "Microsoft Forms feedback", dqc: [partial, "Ready; switched on when the form link is added"], dam: [full, "Live"], cat: [notseen, ""]}
      - {item: "Open data API and downloads", dqc: [full, "api/ JSON, feed, sitemap, downloads"], dam: [full, "data/*.json with a DCAT catalogue; llms.txt"], cat: [full, "DCAT JSON-LD and CSV downloads; knowledge layer (SKOS, OWL, PROV)"]}
      - {item: "MCP server for AI assistants", dqc: [full, "Toolkit server, 16 tools"], dam: [full, "Reference server, five tools"], cat: [notseen, ""]}
      - {item: "Cross-reference manifest", dqc: [full, "api/xref.json (from v2.10.0)"], dam: [full, "data/xref.json"], cat: [partial, "Footer and view signposts (from this release); no manifest yet"]}
      - {item: "Offline copy", dqc: [full, "Zip of the whole portal"], dam: [notseen, ""], cat: [full, "Single file, opens offline"]}
      - {item: "Embed and white-label", dqc: [full, "?embed=1 with your colour; fork and rebrand"], dam: [partial, "Ten reuse routes described"], cat: [partial, "Government edition built from a companion repository"]}
  - group: Trust and quality
    rows:
      - {item: "Source label on each fact", dqc: [partial, "Verified flag and checked date per source"], dam: [full, "Verified, practitioner, synthesis, search, general or unconfirmed"], cat: [full, "Evidence and measured accuracy per label"]}
      - {item: "Automated accessibility checks", dqc: [full, "axe on every page, light and dark"], dam: [full, "axe, keyboard, 320 to 1920 px"], cat: [full, "axe, width and contrast tests"]}
      - {item: "Scheduled health checks", dqc: [full, "Content health, link checks"], dam: [full, "Weekly status run"], cat: [full, "Self-routines, staleness"]}
      - {item: "Two engines checked against each other", dqc: [full, "Python and browser parity"], dam: [none, ""], cat: [partial, "Checks re-run in the reader's browser"]}

gains:
  - portal: dqc
    from_dam: ["Source labels on each fact (verified, practitioner, synthesis and so on)", "Display options for text size and spacing", "Progress tracking across modules", "Requirement-by-requirement DAM Policy view to link playbook stages to"]
    from_cat: ["Evidence of real practice in public code for each wheel area and standard", "Measured accuracy of automatic labels", "Persona tours that span hubs"]
  - portal: dam
    from_dqc: ["Hands-on tools: the data checker, Weaver with DQV output, issues framework calculator, lock-in checker", "The 60-standard catalogue across data, digital, cyber and technology", "Ask in plain English, embed mode and offline copy"]
    from_cat: ["Code evidence for each capability and sector", "Which organisations already apply DCAT, MEM or DQV in code"]
  - portal: cat
    from_dqc: ["Guidance on what to do next once a gap is found (playbook, checker, standards)", "A share menu, embed mode and a cross-reference manifest", "An MCP server pattern for AI assistants"]
    from_dam: ["The DAM requirement each finding relates to", "Role guidance for leaders acting on estate findings"]

joinup:
  - {id: X1, action: "Shared keys", detail: "Use the same keys for the 11 DAMA areas (DM-GOV to DM-DQ), roles, standards and tool categories, and publish them in a cross-reference manifest (xref.json) in each portal.", status: "DQ Commons and playbooks publish manifests; the catalogue uses the same DAMA areas and standards names"}
  - {id: X2, action: "Related elsewhere", detail: "Each portal signposts the right page of the others at the point of need, naming the portal and its status, never merging journeys.", status: "In all three from this release"}
  - {id: X3, action: "Journeys that continue", detail: "Deep links that carry the reader to the exact next step (an area, a standard, a role) in the next portal.", status: "Five cross-portal journeys on the ecosystem page; from v2.15 all three portals show the journey bar (js/journey-bar.js), so your place is kept wherever a step is"}
  - {id: X4, action: "Lineage you can follow", detail: "One map of how a DAM requirement leads to a capability, a DAMA area, a Commons tool and evidence in code, and back.", status: "Interactive map on the ecosystem page"}
  - {id: X5, action: "Live link checks", detail: "Each portal reads the others' manifests (same web address family, no tracking) and reports any key that has moved.", status: "The ecosystem page checks the playbooks' manifest live"}
  - {id: X6, action: "Consistent experience", detail: "The same accessibility standard (WCAG 2.2 AA), plain English, tooltips, share and feedback routes, and colour per part of each portal.", status: "Mostly aligned; display options and source labels to adopt in the Commons"}
  - {id: X7, action: "One feedback picture", detail: "Feedback that is really about another portal is passed on, and themes are compared each quarter.", status: "Proposed: backlog item BL-30, scored on the open roadmap"}
  - {id: X8, action: "A neutral starting point", detail: "The estate compass in the DAM playbooks (dam-capability-playbooks/compass/) asks four questions and gives a route across all three portals, with the order of precedence: obligation before practice, look before you build.", status: "Live in the DAM playbooks from 1.8.2"}
  - {id: X9, action: "Research and roadmap in the open", detail: "Each portal publishes its backlog and how it prioritises, and invites users of the others to its research.", status: "DQ Commons from 2.11.0 (research.html, roadmap.html); the catalogue has a public roadmap"}

