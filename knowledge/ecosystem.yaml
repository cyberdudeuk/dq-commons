journeys:
  - id: J1
    name: "From a DAM requirement to measured quality"
    who: "Data owner or steward"
    steps:
      - {portal: dam, path: "dam.html", text: "Find the requirement and the step that meets it"}
      - {portal: dam, path: "quality.html", text: "Follow the quality playbook steps"}
      - {portal: dqc, path: "check.html", text: "Run the checks on your data in the browser"}
      - {portal: dqc, path: "guidance.html", text: "Prioritise issues with the issues framework"}
      - {portal: dqc, path: "weaver.html", text: "Publish metadata and its quality as DCAT and DQV"}
  - id: J2
    name: "From a standard to evidence of who uses it"
    who: "Architect or catalogue manager"
    steps:
      - {portal: dqc, path: "interop.html#catalogue", text: "Look up the standard and its UK status"}
      - {portal: dqc, path: "interop.html#rosetta", text: "See how its terms map across 11 standards"}
      - {portal: cat, path: "#standards", text: "See which public bodies apply it in code"}
      - {portal: dam, path: "tooling.html", text: "Check how tools connect through it, and what to ask suppliers"}
  - id: J3
    name: "From the DAMA wheel to an estate plan"
    who: "Chief data officer"
    steps:
      - {portal: dqc, path: "maturity.html", text: "Assess maturity"}
      - {portal: dqc, path: "wheel.html", text: "See it on the wheel and pick the weakest areas"}
      - {portal: dam, path: "capability-model.html", text: "Find the DAM capabilities in those areas"}
      - {portal: cat, path: "#dama", text: "See code evidence for those areas across government"}
      - {portal: cat, path: "#legacy", text: "Check legacy and debt in your organisation"}
  - id: J4
    name: "Buying a catalogue or quality tool without lock-in"
    who: "Commercial lead and data leader"
    steps:
      - {portal: dam, path: "tooling.html", text: "Understand tool kinds and pairings"}
      - {portal: cat, path: "#suppliers", text: "See which tools public bodies already use"}
      - {portal: dqc, path: "catalogues.html", text: "Run the lock-in checker and build RFI questions"}
      - {portal: dqc, path: "commercial.html", text: "Add contract clauses for data quality and exit"}
  - id: J5
    name: "Running data quality through a programme"
    who: "SRO or programme manager"
    steps:
      - {portal: dam, path: "change.html", text: "Embed the policy in the programme"}
      - {portal: dqc, path: "roles.html#change", text: "Agree the RACI and the gate questions"}
      - {portal: dqc, path: "legacy.html", text: "Check the migration and reconcile"}
      - {portal: cat, path: "#legacy", text: "Find legacy code to plan exits from"}

