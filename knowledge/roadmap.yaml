# How an idea becomes a release. Each stage links to where it happens.
pipeline:
- {id: idea, name: "Idea", text: "Anyone suggests a feature or change: the wishlist form, the contact form, a survey, a research session or a co-design workshop.", link: "build.html#wishlist"}
- {id: vote, name: "Votes", text: "People give a wish a thumbs-up on GitHub. Votes are counted every day.", link: "build.html#wishlist"}
- {id: evidence, name: "Evidence", text: "User research and feedback add evidence. Each finding has an id (F-) and links to the items it affects.", link: "research.html#findings"}
- {id: assess, name: "Assessment", text: "At the monthly triage we score the idea on user need, inclusion, strategic alignment and feasibility, estimate effort, and publish the scores and reasons.", link: "roadmap.html#scores"}
- {id: backlog, name: "Backlog", text: "Accepted ideas become backlog items with a GitHub issue and a MoSCoW priority taken from the score.", link: "build.html#backlog"}
- {id: roadmap, name: "Roadmap", text: "Items move to Now, Next or Later by status, priority and the capacity we have.", link: "roadmap.html#roadmap"}
- {id: release, name: "Release", text: "Delivered work is released with a version number, a changelog and a What's new entry.", link: "build.html#releases"}
- {id: tell, name: "You said, we did", text: "We tell people what changed because of what they said, and link the finding to the release.", link: "research.html#findings"}

governance:
- "Monthly triage, in the open: new wishes, feedback and research findings are scored and the results published on this page and in each GitHub issue."
- "Anyone can challenge a score or decision through the contact form ('Suggest an idea for the roadmap'); we reply within 10 working days and record the outcome."
- "Quarterly roadmap review: capacity is re-estimated, objectives checked against their measures, and anchors re-read for changes in government strategy."
- "Ideas that are out of scope (for example, anything needing personal data or a paid service) are closed with the reason and, where possible, a pointer to who can help."
