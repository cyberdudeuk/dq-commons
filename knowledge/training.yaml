# How to grow data quality skills in a team, beyond courses.
development:
- title: Learn by doing
  text: Run a real check on one of your datasets in the first week, then repeat it monthly.
- title: Pair and shadow
  text: Pair a new steward with an experienced one for one action plan from start to finish.
- title: Communities of practice
  text: Join a data quality network and bring one problem to each meeting. See Community.
- title: Set objectives
  text: Put one measurable data quality goal in each data role's objectives.
- title: Recognise contributions
  text: Credit people for fixing data at source, not only for reporting problems.
- title: Make it accessible
  text: Offer every learning option in more than one format, with captions, transcripts and plain English.
