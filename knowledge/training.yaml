# Skills, training, education and learning and development for data quality.
# Honesty rules: "checked: yes" means the provider's page was read when added; "listed" means found but not yet read
# in full. Cost and format are as the provider states; "not stated" means the provider doesn't say.
# Free and open options are listed first. No trainer or staff names.
review:
  last_reviewed: '2026-10-15'
  owner_role: Content steward (learning)
levels:
- Awareness
- Working
- Practitioner
- Expert

# Skills for data quality, aligned with the Government Digital and Data (GDaD) capability framework's data skills.
# GDaD has no standalone data quality skill (checked 3 November 2026); the closest skills are named below.
skills:
- id: SK-ASSESS
  name: Assessing data quality
  what: Define rules and targets, measure, and read results.
  ddat: Data preparation and linkage; Data management
  modules:
  - m1
  - m2
- id: SK-ACTION
  name: Data quality action planning
  what: Prioritise issues, find root causes and fix at source.
  ddat: Data preparation and linkage; Data governance
  modules:
  - m3
  - m4
- id: SK-GOV
  name: Data governance and ownership
  what: Ownership, stewardship, decision rights and escalation.
  ddat: Data governance
  modules:
  - m9
- id: SK-META
  name: Metadata and cataloguing
  what: Describe data so others can find, trust and reuse it.
  ddat: Metadata management
  modules:
  - m5
  - m10
- id: SK-STAT
  name: Statistical quality and communication
  what: Measure accuracy and uncertainty and explain quality to users.
  ddat: Analysis; communicating analysis
  modules:
  - m6
- id: SK-PROT
  name: Data protection and ethics
  what: Accuracy duties, privacy and fair treatment of people in data.
  ddat: Data ethics and privacy
  modules:
  - m7
- id: SK-ENG
  name: Automating quality checks
  what: Pipelines, data contracts and tests that run every time.
  ddat: Data engineering
  modules:
  - m2
  - m10
- id: SK-AI
  name: Data quality for AI
  what: Representativeness, currency and assurance of data used by AI.
  ddat: Data science; AI engineering
  modules:
  - m8
- id: SK-INC
  name: Inclusion and representativeness
  what: Find who data leaves out and whether quality differs between groups.
  ddat: Data ethics and privacy
  modules:
  - m7
- id: SK-COMM
  name: Commercial and supplier assurance
  what: Put data quality duties into contracts and hold suppliers to them.
  ddat: Commercial (data)
  modules:
  - m9

