# Spotlight: one feature at a time, chosen by type.
spotlights:
- id: sp-contracts
  type: Capability
  title: Data contracts
  standfirst: A written, testable promise about a dataset, between the people who make it and the people who use it.
  story: |
    Data breaks at boundaries: between teams, systems and organisations. A data contract makes expectations explicit and testable every time data crosses one. The Commons toolkit now writes your rules as an Open Data Contract Standard contract, a Frictionless Table Schema or W3C CSVW metadata, keeps the thresholds from the issues framework, and reads contracts back as rules. Python and the browser give identical results.
  try: [["Export your rules as a contract", "check.html#contracts"], ["Read: what is a data contract?", "library.html#kb-data-contract"], ["Interoperability layers", "interop.html"]]
- id: sp-extract
  type: Case study
  title: "Extract: turning planning documents into structured data"
  standfirst: How i.AI and MHCLG used AI to read planning documents and make their data checkable and reusable.
  story: |
    Invalid planning applications often come from data that isn't in the format digital planning tools need. Extract uses AI to read planning documents, pull out details such as addresses and dates, trace map boundaries and place them on a map as structured data. It was tested against a ground-truth set of manually converted Article 4 directions before wider testing. The lesson: a model earns trust through a ground-truth evaluation, and the results should be published.
  try: [["AI for data quality: case studies", "ai.html#cases"], ["The route from experiment to shared toolkit", "ai.html#route"]]
- id: sp-suppliers
  type: Theme
  title: Suppliers carry the responsibility
  standfirst: When suppliers create or hold public data, they should prove its quality at their own cost.
  story: |
    About £21 billion of public sector digital and data spend in 2023 went to third parties, yet only 28% of leaders said they could monitor supplier performance. Twenty model clauses, a tender scoring sheet and a who-does-what table put the burden of proof on the supplier: quality rules in the contract, a published KPI, fixes at the supplier's cost, and an exit pack that works.
  try: [["Build a data quality schedule", "commercial.html#clauses"], ["Tender questions", "commercial.html#tender"]]
- id: sp-reconcile
  type: Workflow
  title: Proving a migration lost nothing
  standfirst: Six checks that show whether data arrived complete and unchanged.
  story: |
    Compare row counts, records missing or new, duplicate keys, totals of number columns, and values for matched records. Do it at every trial migration, not just at cut-over. The reconciliation tool runs in the browser with nothing uploaded, and the same check runs in a pipeline.
  try: [["Reconcile two files", "legacy.html#reconcile"], ["Migration gates", "legacy.html#stages"]]
- id: sp-inclusion
  type: Topic
  title: Who does your data leave out?
  standfirst: Data can pass every overall check while failing particular groups of people.
  story: |
    Forced defaults, narrow name and address formats, and characteristics recorded as "unknown" hit some groups harder than others. Measure quality across groups, use GSS harmonised standards, and make suppliers' systems record people accurately.
  try: [["Recording people accurately", "library.html#kb-record-people"], ["Inclusion survey", "surveys.html"], ["Learning module M7", "learn.html#m7"]]
- id: sp-local
  type: Domain
  title: Local government data quality
  standfirst: Addresses, places and services, measured with the identifiers councils already use.
  story: |
    Councils hold some of the data people depend on most: housing, care, schools, waste, council tax. The Commons checks UPRNs, postcodes, GSS codes and school URNs, and gives councils the same frameworks, packs and supplier clauses as central government, for free.
  try: [["Local government scenario", "scenarios.html#local"], ["Maturity self-assessment", "maturity.html"]]

