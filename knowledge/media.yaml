# Media centre. Blog posts written by the Commons are original; external items link out.
blog:
- id: b-contracts
  title: "Data contracts arrive in the Commons"
  date: "2026-10-15"
  author: Commons team
  topics: [contracts, interoperability]
  summary: Your rules can now travel as an ODCS contract, Table Schema or CSVW, and come back again, with thresholds intact.
  body: |
    Until now, quality rules written in the Commons lived in the Commons format. That's fine for our own pipeline, but most organisations already have tools, suppliers and platforms of their own.

    This release adds data contracts. The checker can export rules as an Open Data Contract Standard (ODCS) contract, a Frictionless Table Schema, W3C CSV on the Web metadata, a Great Expectations suite or R validate rules. It can also read an ODCS contract or Table Schema and turn it into rules.

    Two things we cared about. First, nothing is silently lost: checks a standard can't express travel as a toolkit extension, and rules we can't run (such as SQL) are listed, not dropped. Second, the browser and Python give exactly the same output, checked case by case.

    Try it on the Check your data page, under "Share the rules as a data contract".
- id: b-suppliers
  title: "Why suppliers should carry the burden of data quality"
  date: "2026-10-15"
  author: Commons team
  topics: [suppliers, commercial]
  summary: Public bodies too often pay twice for poor data. Contracts can change that.
  body: |
    Most public data is created, held or changed in systems run by suppliers. When contracts describe functions but not the quality of the data, public bodies pay for the service, then pay again to find and fix poor data, to work around it, or to leave.

    The new Buying and suppliers page sets out twelve commercial barriers, eight principles and twenty model clauses. The core idea is simple: the supplier proves quality, at its own cost, against rules the public body owns, and reports a data quality KPI that is published like any other.

    The clauses are illustrative drafting, not legal advice. They're a starting point for commercial and legal teams, and we'd like to hear how they work in practice.
- id: b-v1
  title: "The Commons is now for everyone working with public sector data"
  date: "2026-10-15"
  author: Commons team
  topics: [Commons]
  summary: What started as data quality work for the National Data Library is now a general hub and toolkit.
  body: |
    The Public Sector Data Quality Commons began with the National Data Library and the data asset management policy. Both are still here as scenarios. But the toolkit, frameworks, learning and community now work for any public body, in any nation, and for the voluntary and private organisations that deliver public services.

    Tell us what's missing on the wishlist, and share what works in the library.

