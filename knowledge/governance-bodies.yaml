  layer: community
  scope: Government Statistical Service
  host: "Government Data Quality Hub"
  purpose: "Raises the quality of official statistics produced by government departments by sharing guidance and good practice, supporting statistical heads of profession."
  aims: ["Share quality guidance and good practice in each department", "Encourage teams to follow the quality principles of the Code of Practice for Statistics"]
  outcomes: ["Easier compliance with the quality aspects of the Code"]
  engagement: "Champions in each department. It promotes good practice and support; it does not enforce compliance."
  decides: "Nothing: it supports"
  cadence: "Network meetings"
  tor: described
  activity: active
  links:
  - {title: "GSS quality champions", url: "https://analysisfunction.civilservice.gov.uk/government-statistical-service-and-statistician-group/champion-networks/quality-champions"}

- id: expert-communities
  name: "Government data expert communities"
  layer: community
  scope: UK government
  host: "Government Digital Service and partners"
  purpose: "Communities the DSA draws on to find problems, share practice and develop and review standards: the Government Data Architecture Community, the API Community and the Data Sharing Practitioners Community."
  aims: ["Identify problems", "Share best practice", "Develop and review solutions and standards"]
  outcomes: ["Standards shaped by the people who will use them"]
  engagement: "For public sector practitioners in each discipline."
  decides: "Nothing: they advise and contribute"
  cadence: "Varies"
  tor: described
  activity: active
  links:
  - {title: "DSA operational model and processes", url: "https://www.gov.uk/government/publications/data-standards-authority-operational-model-and-processes/data-standards-authority-operational-model-and-processes"}

- id: scot-hsc
  name: "Scotland: Health and Social Care Data Board"
  layer: devolved
  scope: Scotland (health and social care)
  host: "Scottish Government and COSLA"
  purpose: "Develops the governance and delivery arrangements for using data in health and social care, with a Data Delivery Sub-board and a Data Standards Sub-board that sets preferred standards across the sector."
  aims: ["Lead governance and delivery for health and social care data", "Set common data standards for the sector", "Work with other data governance bodies on shared priorities"]
