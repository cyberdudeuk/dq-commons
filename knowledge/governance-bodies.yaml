  purpose: "Scores new ideas, wishes, feedback and research findings against published criteria, decides the backlog and roadmap, and reviews capacity and strategy every quarter."
  aims: ["Score and decide in the open", "Fix anything that excludes people first", "Keep the Commons aligned with government strategy"]
  outcomes: ["A public, traceable backlog and roadmap", "Challenges answered within 10 working days"]
  engagement: "Anyone can suggest, vote or challenge a decision through the contact form. Scores, reasons and decisions are published on the open roadmap."
  decides: "The Commons' backlog, priorities and roadmap"
  cadence: "Monthly triage; quarterly roadmap review"
  tor: published
  activity: active
  links:
  - {title: "Open roadmap and priorities", url: "roadmap.html#governance"}
  - {title: "Co-design charter, rules and safeguards", url: "build.html#charter"}

- id: commons-moderation
  name: "Commons moderation and content review"
  layer: commons
  scope: DQ Commons
  host: "Commons moderators"
  purpose: "Checks every contribution before it is public, keeps sources current and samples facts each quarter."
  aims: ["Nothing harmful, personal or misleading is published", "Sources stay current and checked"]
  outcomes: ["Trustworthy, current content", "Decisions on contributions within 10 working days"]
  engagement: "Moderation rules and service levels are published; anyone can report a problem with content through the contact form."
  decides: "Whether a contribution is published"
