  engagement: "Members from the Scottish Government, NHS boards, local government and partners; terms of reference published."
  decides: "Governance and standards for health and social care data in Scotland"
  cadence: "Regular meetings with published minutes"
  tor: published
  activity: active
  links:
  - {title: "Health and Social Care Data Board", url: "https://www.gov.scot/groups/health-and-social-care-data-board/"}

- id: scot-research
  name: "Scotland: Data for Research Change Management Board"
  layer: devolved
  scope: Scotland
  host: "Scottish Government"
  purpose: "Set up in November 2025 to streamline how Scotland manages, shares and uses administrative data for public good research."
