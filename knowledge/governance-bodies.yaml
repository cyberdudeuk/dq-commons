- id: org-governance
  name: "Your organisation: chief data officer, data owners and a data governance board"
  layer: local
  scope: "Each organisation in scope of the DAM Policy"
  host: "Your organisation"
  purpose: "The DAM Policy makes each organisation's chief data officer responsible for implementing it, gives every critical data asset a named data owner, and expects a data quality action plan for each asset. Most organisations run a data governance board (or use an existing senior board) to make these decisions; statistics producers often have a senior statistics board."
  aims: ["Identify and record critical data assets and report them to GDS", "Name data owners and keep the ownership model current", "Approve and track data quality action plans and escalations"]
  outcomes: ["An annual return to GDS that is complete and assured", "Quality issues on critical data fixed at source"]
  engagement: "A typical pattern, not a mandated structure: the DAM Policy names roles and duties, not a board. Local government can apply the policy optionally; devolved governments have their own approaches."
  decides: "Local priorities, ownership, DQAP approval and escalation"
  cadence: "Typically quarterly, plus the annual return cycle"
  tor: not found
  activity: active
  dam: [DAM-R05, DAM-R06, DAM-R08, DAM-R09, DAM-R14]
  links:
  - {title: "Data Asset Management Policy", url: "https://www.gov.uk/government/publications/data-asset-management-policy-in-government/data-asset-management-policy-in-government"}
  - {title: "Governance roles in the Commons (RACI)", url: "roles.html#change"}

