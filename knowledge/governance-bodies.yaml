  links:
  - {title: "How we keep content trustworthy", url: "build.html#trust"}

# How a data standard moves through government governance (from the DSA operational model), and where the Commons plugs in.
standards_flow:
- {step: "Identify", who: "Departments, domains or functions; an open standards challenge; data projects; analysis of the standards catalogue", commons: "Raise it on the Commons roadmap or in the Government Data Quality Community"}
- {step: "Research and review", who: "The proposal lead, with expert communities", commons: "Use the Commons' standards catalogue, Rosetta Stone and evidence from public code"}
- {step: "Prioritise", who: "The Head of Frameworks and Standards recommends to the Government Chief Data Officer; the Steering Board and Peer Review Group validate", commons: ""}
- {step: "Taxonomies", who: "Taxonomy Oversight Group", commons: ""}
- {step: "Consult", who: "Public consultation targeted at experts", commons: "Share the consultation with the Commons community"}
- {step: "Review", who: "DSA and DQ Hub Peer Review Group", commons: "Send data quality proposals here (for example the Weaver's UK mapping)"}
- {step: "Approve", who: "DSA Steering Board", commons: ""}
- {step: "Publish and monitor", who: "The standard's lead or owner", commons: "The Commons adds it to the standards catalogue and checks it in the Weaver"}

routes:
- {question: "I want a data standard adopted across government", go: [dsa-prg, dsa-steering, osb]}
- {question: "I need to share personal data with another public body for a public service", go: [psd-review]}
- {question: "Who oversees the DAM Policy?", go: [cdo-council, org-governance]}
- {question: "I want to improve data quality with peers", go: [dq-community, quality-champions]}
- {question: "I produce statistics and want to show they can be trusted", go: [osr, quality-champions, jersey-sug]}
- {question: "I want to influence the National Data Library", go: [ndl-eag]}
- {question: "I work with location data", go: [geo]}
- {question: "I want to change what the Commons does next", go: [commons-triage]}
