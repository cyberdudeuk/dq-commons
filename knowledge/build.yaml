# Self-checking routines that keep content current, accurate and trustworthy. status: running (in CI), on-demand, planned.
routines:
- {name: "Unit and integration tests", what: "150+ tests: toolkit, knowledge base, portal build, privacy guards.", when: "Every change (CI)", status: running}
- {name: "Two-engine parity", what: "The browser engine and the Python toolkit give the same answer, case by case, including the Metadata Weaver.", when: "Every change", status: running}
- {name: "Content health report", what: "Review dates, freshness, verification ratio, personal and sensitive data, duplicates, claims recounted from data, links, language.", when: "Every change and weekly", status: running}
- {name: "Link checker", what: "Every external link is requested; broken ones keep one tracked issue up to date, with an archived copy for each.", when: "Monthly", status: running}
- {name: "Review dates", what: "Every knowledge file names an owning role; a test fails after 12 months without review. Each page shows when its content was last reviewed and by which role.", when: "Every change", status: running}
- {name: "Community docs in sync", what: "CHARTER.md and CONTRIBUTORS.md are regenerated from the same source as the portal.", when: "Every change", status: running}
- {name: "Backlog to issues and roadmap", what: "Every backlog item has exactly one GitHub issue, in the Now, Next, Later or Done milestone that matches this page's roadmap.", when: "When the backlog changes", status: running}
- {name: "Moderation and triage", what: "People check every contribution before it is public; a daily Triage workflow flags anything waiting past its service level (docs/MODERATION.md).", when: "Daily triage; decisions within 10 working days", status: running}
- {name: "Accessibility checks in CI", what: "Automated axe-core checks on every page, light and dark, desktop and phone (runs on GitHub on every change).", when: "Every change", status: running}
- {name: "Source archiving", what: "The monthly link check asks the Internet Archive to save a rotating slice of sources, and every broken link comes with its archived copy.", when: "Monthly", status: running}
- {name: "Freshness issues", what: "Stale news and reviews open (and later close) one GitHub issue for the owning roles automatically.", when: "Weekly", status: running}
- {name: "Source diffing", what: "The monthly link check fingerprints each source's text and lists the ones that changed, so the summaries citing them are re-read.", when: "Monthly", status: running}
- {name: "Fact sampling", what: "Each quarter a workflow opens a checklist of a random 5% of sourced claims; a person re-checks them and records the error rate.", when: "Quarterly", status: running}
- {name: "Repository health", what: "Settings are compared with .github/settings-baseline.json and missing labels are created; drift keeps one tracked issue up to date.", when: "Weekly", status: running}
- {name: "Weekly maintenance", what: "A scheduled Claude task reviews runs, issues, Dependabot pull requests and content health, fixes what it safely can and reports the rest.", when: "Mondays", status: running}
- {name: "AI output evaluation", what: "The rule-drafting assistant is scored against a fixed evaluation set before each change.", when: "Before AI changes", status: on-demand}
- {name: "Inclusion review", what: "Each GitHub Release opens an inclusion review checklist: assistive technology, plain English, every nation and territory, no new account barriers, no personal data.", when: "Each release", status: running}
- {name: "Dependency and secret scanning", what: "Dependabot updates, secret scanning with push protection, CodeQL, OpenSSF Scorecard, and a test that refuses credentials, private links and marking banners.", when: "Continuous", status: running}

contact_topics: [General question, Report a problem with content, Accessibility problem, Suggest a partner or framework, Join co-design, Withdraw my contribution, Media or speaking request, Something else]
