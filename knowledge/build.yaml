# Self-checking routines that keep content current, accurate and trustworthy. status: running (in CI), on-demand, planned.
routines:
- {name: "Unit and integration tests", what: "116+ tests: toolkit, knowledge base, portal build, privacy guards.", when: "Every change (CI)", status: running}
- {name: "Two-engine parity", what: "The browser engine and the Python toolkit give the same answer, case by case, including the Metadata Weaver.", when: "Every change", status: running}
- {name: "Content health report", what: "Review dates, freshness, verification ratio, personal and sensitive data, duplicates, claims recounted from data, links, language.", when: "Every change and weekly", status: running}
- {name: "Link checker", what: "Every external link is requested; broken ones open an issue.", when: "Weekly", status: running}
- {name: "Review dates", what: "Every knowledge file names an owning role; a test fails after 12 months without review.", when: "Every change", status: running}
- {name: "Community docs in sync", what: "CHARTER.md and CONTRIBUTORS.md are regenerated from the same source as the portal.", when: "Every change", status: running}
- {name: "Backlog to issues", what: "Every backlog item has exactly one GitHub issue.", when: "When the backlog changes", status: running}
- {name: "Moderation", what: "People check every contribution before it is public.", when: "Within 10 working days", status: running}
- {name: "Accessibility checks in CI", what: "Automated axe-core checks on every page, light and dark, desktop and phone.", when: "Every change", status: planned}
- {name: "Source archiving", what: "An archived copy of each cited source, so evidence survives link rot.", when: "Monthly", status: planned}
- {name: "Freshness issues", what: "Stale news and reviews open a GitHub issue for the owning role automatically.", when: "Weekly", status: planned}
- {name: "Source diffing", what: "Detect when an official source changes after we summarised it, and flag the summary for review.", when: "Monthly", status: planned}
- {name: "Fact sampling", what: "A person re-checks a random 5% of claims against sources each quarter, and publishes the error rate.", when: "Quarterly", status: planned}
- {name: "AI output evaluation", what: "The rule-drafting assistant is scored against a fixed evaluation set before each change.", when: "Before AI changes", status: on-demand}
- {name: "Inclusion review", what: "Check content and examples for missing groups, nations and jurisdictions, with people affected.", when: "Each release", status: planned}
- {name: "Dependency and secret scanning", what: "GitHub Dependabot and secret scanning on the repository.", when: "Continuous", status: planned}

