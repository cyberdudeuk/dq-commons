# Recurring events whose exact dates are announced by their organisers each year.
recurring:
- title: Open Data Day
  when: Each year in early March, held over about a week (since 2023)
  organiser: Coordinated by the Open Knowledge Foundation; events run by local groups worldwide
  url: https://opendataday.org/
  checked: 'yes'
  checked_on: '2026-10-30'
- title: UN Statistical Commission annual session
  when: Each year, usually early March (around four days), UN Headquarters, New York
  organiser: United Nations (Statistical Commission of the Economic and Social Council, serviced by the UN Statistics Division)
  url: https://unstats.un.org/UNSDWebsite/statcom
  checked: 'yes'
  checked_on: '2026-10-30'
- title: Royal Statistical Society events programme
  when: Throughout the year, including local groups across the UK
  organiser: Royal Statistical Society
  url: https://rss.org.uk/training-events/events/
  checked: 'yes'
  checked_on: '2026-10-30'
- title: Analysis Function training and events
  when: Throughout the year, for UK government analysts
  organiser: Government Analysis Function
  url: https://analysisfunction.civilservice.gov.uk/learning-development/
  checked: 'yes'
  checked_on: '2026-10-30'
commons_note: Commons show and tells and co-design sessions will appear here once dates are agreed. Times rotate so people in different time zones can join, and every session has captions and a transcript.
