name: Commission help
description: Ask the Commons for help - an assessment, rules, a pack, a DQAP review, training or incident support.
title: "[Commission] "
labels: [commission, triage]
body:
  - type: dropdown
    id: type
    attributes:
      label: What do you need?
      options: [Assess one of our data assets, Help writing rules, A new framework or scenario pack, Peer review of a DQAP, A training session, Tooling advice, Help with a data quality incident, Run a survey through the Commons, Something else]
    validations: {required: true}
  - type: textarea
    id: detail
    attributes: {label: "Tell us what you need and by when. Please don't include personal or sensitive data."}
    validations: {required: true}
  - type: input
    id: contact
    attributes: {label: "Team inbox for follow-up (optional)"}
