name: Contribute to the library
description: Share a case study, insight, resource or guidance for the knowledge base.
title: "[Contribution] "
labels: [contribution, triage]
body:
  - type: dropdown
    id: kind
    attributes: {label: "Type", options: [Case study, Insight or lesson, Resource or link, Knowledge base article, Guidance or method, Training material, Rule or pack, Dataset quality assessment, Event, Blog post, Video, Podcast episode]}
    validations: {required: true}
  - type: textarea
    id: summary
    attributes: {label: "Summary", description: "What it is and what others can learn from it. No personal data."}
    validations: {required: true}
  - type: input
    id: link
    attributes: {label: "Link (if published elsewhere)"}
  - type: textarea
    id: details
    attributes: {label: "Details (optional)", description: "Anything else moderators need: nation or region, sector, licence, how to credit it, dates and place for an event, captions or transcript for a video or podcast. The portal fills this in for you when you start from it. No names or email addresses."}
  - type: dropdown
    id: share
    attributes: {label: "Can it be published openly?", options: ["Yes, as is", "Yes, anonymised", "Commons members only"]}
