# Generated by scripts/gen_issue_forms.py from the knowledge base. Edit the knowledge file, not this.
name: 'Survey: Critical data asset baseline readiness'
description: About 4 minutes. Totals only are published.
title: '[Survey] Critical data asset baseline readiness'
labels:
- survey-response
- survey:baseline-readiness
body:
- type: markdown
  attributes:
    value: 'Shows how ready organisations are to report data quality for their critical data assets, and where help is needed.


      **Before you answer.** GitHub issues are public as soon as you submit, and show your GitHub username. Answer for your organisation only if you are happy for that to be seen, or ask a colleague to
      submit for the team. Never include names, email addresses or any other personal data. The Commons publishes only totals, and hides any count under 5. To withdraw, use the contact form (Withdraw my
      contribution).'
- type: dropdown
  id: org_type
  attributes:
    label: What kind of organisation do you work for?
    options:
    - Ministerial department
    - Non-ministerial department
    - Arm's length body
    - Local authority
    - Devolved government
    - NHS or health and care body
    - Police or justice body
    - Education body
    - Voluntary or charity organisation
    - Private sector supplier
    - University or research body
    - Crown Dependency government or body
    - Overseas Territory government or body
    - Government outside the UK
    - International or supranational organisation
    - Other
- type: dropdown
  id: nation
  attributes:
    label: Where does your organisation mainly work?
    multiple: true
    options:
    - England
    - Wales
    - Scotland
    - Northern Ireland
    - UK-wide
    - Crown Dependencies
    - Overseas Territories
    - Commonwealth country
    - Other country
    - International
- type: dropdown
  id: cdas
  attributes:
    label: How many critical data assets does your organisation have?
    options:
    - None identified yet
    - 1 to 5
    - 6 to 20
    - 21 to 100
