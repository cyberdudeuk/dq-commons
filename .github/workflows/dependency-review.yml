# On every pull request: refuse new dependencies with known high-severity vulnerabilities or licences
# that aren't open (supply-chain safety, as Scorecard and the NCSC recommend).
name: Dependency review
on: {pull_request: {branches: [main]}}
permissions: {contents: read, pull-requests: write}
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
