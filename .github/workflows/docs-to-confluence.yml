# Publish the operating model, user guide, decision log and runbook to Confluence on merge to main.
# Dry run until the Confluence secrets are set (see integrations/config.yaml).
name: Docs to Confluence
on:
  push:
    branches: [main]
    paths: ["docs/**", "integrations/config.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/publish_confluence.py
