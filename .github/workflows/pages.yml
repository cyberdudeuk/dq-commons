name: publish portal
# Builds the portal and publishes it to GitHub Pages: on every push to main, when a moderator publishes or
# withdraws something (issue labels), and every morning so votes, survey totals and the benchmark stay current.
# One-off setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push: {branches: [main]}
  issues: {types: [labeled, unlabeled]}
  schedule: [{cron: "37 5 * * *"}]
  workflow_dispatch:
permissions: {contents: read, issues: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    # On issue events, only when a moderator publishes or withdraws something
    if: github.event_name != 'issues' || github.event.label.name == 'published' || github.event.label.name == 'withdrawn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}  # full history, for each page's "last changed" line (issue #21)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/build_dq_portal.py --repo "https://github.com/${{ github.repository }}"
        env: {GITHUB_TOKEN: "${{ github.token }}"}  # read-only: issue numbers, states and votes for the backlog and wishlist
      # The build bundle page sits alongside the portal at /bundle/
      - run: mkdir -p portal/dist/bundle && cp docs/bundle/index.html portal/dist/bundle/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: {path: portal/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
