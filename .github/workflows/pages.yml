name: publish portal
# Builds the portal and publishes it to GitHub Pages on every push to main.
# One-off setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/build_dq_portal.py --repo "https://github.com/${{ github.repository }}"
      # The build bundle page sits alongside the portal at /bundle/
      - run: mkdir -p portal/dist/bundle && cp docs/bundle/index.html portal/dist/bundle/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: portal/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
