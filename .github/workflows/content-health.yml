# The Commons checks itself: review dates, freshness, verification, personal and sensitive data,
# duplicates, claims recounted from data, links and language. Fails on errors.
# On the weekly run it also keeps one "Content health" issue up to date (opened when there are
# warnings or errors, closed when everything is clear), so stale content reaches its owning role.
name: Content health
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: pip install -r requirements.txt
      - run: python scripts/gen_community_docs.py --check
      - run: python scripts/build_playbook_doc.py --check
      - run: python scripts/build_bundle.py --check
      - run: python scripts/build_vocab.py && git diff --exit-code vocab/
      - name: Content health report
        id: health
        run: python scripts/self_check.py --out health
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with: {name: content-health, path: health/}
      - name: Keep the Content health issue up to date
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const h = JSON.parse(fs.readFileSync('health/health.json', 'utf8'));
            const md = fs.readFileSync('health/health.md', 'utf8');
            const title = 'Content health: findings to review';
            const open = (await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'content-health'})).data
              .filter(i => i.title === title);
            const needed = h.counts.error + h.counts.warning > 0;
            const body = `Generated by the weekly Content health run on ${h.as_of}. Owning roles: please review the items below.\n\n${md}`;
            if (needed && open.length) await github.rest.issues.update({...context.repo, issue_number: open[0].number, body});
            else if (needed) await github.rest.issues.create({...context.repo, title, body, labels: ['content-health']});
            else for (const i of open) {
              await github.rest.issues.createComment({...context.repo, issue_number: i.number, body: `All clear on ${h.as_of}. Closing.`});
              await github.rest.issues.update({...context.repo, issue_number: i.number, state: 'closed'});
            }
      - name: Fail on errors
        if: steps.health.outcome == 'failure'
        run: exit 1
      - name: Two-engine parity
        run: python scripts/parity_check.py
