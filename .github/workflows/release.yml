name: release
# When a version tag (v1.2.3) is pushed, check it matches knowledge/releases.yaml,
# then create a GitHub release with the notes from that file, the source zip, the offline portal and an SBOM,
# sign build provenance for the downloads,
# and open an inclusion review checklist for that version (the "Inclusion review" routine).
on:
  push: {tags: ["v*.*.*"]}
permissions: {contents: write, issues: write, id-token: write, attestations: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - id: notes
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - run: git archive --format=zip --prefix="dq-commons-${GITHUB_REF_NAME}/" -o "dq-commons-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python scripts/build_dq_portal.py --repo "https://github.com/${GITHUB_REPOSITORY}" > /dev/null
          cp portal/dist/downloads/dq-commons-offline.zip "dq-commons-${GITHUB_REF_NAME}-offline-portal.zip"
          # Software bill of materials (SPDX), from GitHub's dependency graph
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" -q .sbom > "dq-commons-${GITHUB_REF_NAME}-sbom.spdx.json"
          gh release create "${GITHUB_REF_NAME}" "dq-commons-${GITHUB_REF_NAME}.zip" "dq-commons-${GITHUB_REF_NAME}-offline-portal.zip" "dq-commons-${GITHUB_REF_NAME}-sbom.spdx.json" --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
      # Signed build provenance: anyone can check a download came from this repository's workflow
      # (gh attestation verify FILE -R cyberdudeuk/dq-commons)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dq-commons-*.zip"
      - name: Open the inclusion review for this release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh label create inclusion-review --color 5319e7 2>/dev/null || true
          gh issue create --label inclusion-review --title "Inclusion review for ${GITHUB_REF_NAME}" --body-file .github/inclusion-review.md
