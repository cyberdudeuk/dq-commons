# Monthly: check every external link in the knowledge base and portal, ask the Internet Archive to save a
# rotating slice of them (issue #20), flag sources whose text changed since last month (source diffing), and keep one "Broken links" issue up to date (opened, updated or closed).
name: Link check
on:
  schedule: [{cron: "17 6 1 * *"}]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/source-hashes.json
          key: source-hashes-${{ github.run_id }}
          restore-keys: source-hashes-
      - id: check
        run: python scripts/check_links.py --out link-report.md --archive 40 --diff .cache/source-hashes.json
        continue-on-error: true
      - if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('link-report.md') ? fs.readFileSync('link-report.md', 'utf8') : '';
            const broken = '${{ steps.check.outcome }}' === 'failure';
            const title = 'Broken links found by the monthly check';
            const open = (await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'links'})).data;
            if (broken && open.length) await github.rest.issues.update({...context.repo, issue_number: open[0].number, body});
            else if (broken) await github.rest.issues.create({...context.repo, title, body, labels: ['content', 'links']});
            else for (const i of open) {
              await github.rest.issues.createComment({...context.repo, issue_number: i.number, body: 'Every link works on this run. Closing.'});
              await github.rest.issues.update({...context.repo, issue_number: i.number, state: 'closed'});
            }
