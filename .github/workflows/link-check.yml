# Monthly: check every external link in the knowledge base and portal; open an issue if any are broken.
name: Link check
on:
  schedule: [{cron: "17 6 1 * *"}]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: check
        run: python scripts/check_links.py --out link-report.md
        continue-on-error: true
      - if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('link-report.md', 'utf8');
            await github.rest.issues.create({ ...context.repo, title: 'Broken links found by the monthly check', body, labels: ['content'] });
