# Label every pull request by the areas it touches, so reviews reach the right people.
name: Label pull requests
# pull_request, not pull_request_target (GDS Way: avoid risky triggers). Fork PRs get a read-only token,
# so labelling is skipped for them rather than failing.
on: {pull_request: {types: [opened, synchronize]}}
permissions: {contents: read, pull-requests: write}
jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
