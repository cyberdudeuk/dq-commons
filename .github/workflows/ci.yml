name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      # python-docx is needed for the draft case study (.docx)
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_vocab.py && git diff --exit-code vocab/
      - run: python scripts/build_models.py --check
      - run: python scripts/run_ndl_assessment.py
      # Smoke test: the whole portfolio runs end to end into a scratch folder
      - run: python -m dqkit run portfolio.ndl.yaml --out /tmp/dq-ci --as-of 2026-10-14
      # The portal builds from the results, with no placeholders left
      - run: python scripts/build_dq_portal.py --out /tmp/dq-portal
