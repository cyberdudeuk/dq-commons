# Create a GitHub issue for every backlog item in knowledge/build.yaml that doesn't have one yet.
# Idempotent: existing issues are found by their [BL-nn] prefix. --sync puts each in the Now, Next, Later or Done
# milestone (the portal's roadmap stages), updates its Status line and the needs-people label.
name: Backlog to issues
on:
  push:
    branches: [main]
    paths: [knowledge/build.yaml]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python scripts/backlog_to_issues.py --apply --sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
