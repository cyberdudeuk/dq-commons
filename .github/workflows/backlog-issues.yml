# Create a GitHub issue for every backlog item in knowledge/build.yaml that doesn't have one yet.
# Idempotent: existing issues are found by their [BL-nn] prefix and left alone.
name: Backlog to issues
on:
  push:
    branches: [main]
    paths: [knowledge/build.yaml]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python scripts/backlog_to_issues.py --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
